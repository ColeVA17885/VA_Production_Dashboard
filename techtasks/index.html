<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Tech Tasks</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #151d2e;
    --panel-2: #1d2740;
    --border: #2a3557;
    --border-soft: #212c48;
    --text: #e8edf7;
    --text-2: #b9c3d6;
    --muted: #7a8399;
    --accent: #5b8def;
    --accent-hover: #4573dc;
    --accent-soft: rgba(91,141,239,0.14);
    --success: #22c58a;
    --warn: #f2a63d;
    --danger: #ef5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }

  /* Login */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
  }
  .login-card h1 { margin: 0 0 4px; font-size: 24px; }
  .login-card p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .login-card label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-card button {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }
  .login-card button:hover { background: var(--accent-hover); }
  .login-card button:disabled { opacity: 0.6; cursor: not-allowed; }
  #loginError { margin-top: 12px; color: var(--danger); font-size: 13px; min-height: 18px; }

  /* App */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  header {
    padding: 14px 22px;
    background: rgba(21,29,46,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  header .role-badge {
    font-size: 10px;
    padding: 3px 9px;
    background: var(--accent-soft);
    border: 1px solid rgba(91,141,239,0.3);
    border-radius: 999px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
  }
  header .spacer { flex: 1; }
  header .who { font-size: 13px; color: var(--muted); }
  header .logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    transition: background 0.15s, color 0.15s;
  }
  header .logout:hover { background: var(--panel-2); color: var(--text); }

  main {
    flex: 1;
    padding: 24px 22px 60px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  /* Owner: add form */
  .add-card {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 6px 6px 6px 14px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .add-card svg { flex-shrink: 0; color: var(--muted); }
  .add-card input[type=text] {
    flex: 1;
    padding: 12px 4px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
  }
  .add-card input:focus { outline: none; }
  .add-card input::placeholder { color: var(--muted); }
  .add-card button {
    padding: 9px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s, transform 0.05s;
  }
  .add-card button:hover { background: var(--accent-hover); }
  .add-card button:active { transform: scale(0.97); }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }

  /* Filter tabs — underline style */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border-soft);
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 10px 14px;
    background: transparent;
    color: var(--muted);
    border: none;
    border-bottom: 2px solid transparent;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--text-2); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count {
    opacity: 0.7;
    font-size: 12px;
    margin-left: 6px;
    padding: 1px 7px;
    background: var(--panel-2);
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .tab.active .count { background: var(--accent-soft); color: var(--accent); opacity: 1; }

  #clearDoneBtn {
    padding: 7px 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  #clearDoneBtn:hover { color: var(--danger); border-color: rgba(239,90,90,0.4); }

  /* Task list */
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .task:hover { border-color: var(--border); }
  .task.status-progress { border-left: 3px solid var(--warn); padding-left: 13px; }
  .task.status-done { opacity: 0.55; }
  .task.status-done:hover { opacity: 0.85; }
  .task.status-done .task-title { text-decoration: line-through; text-decoration-color: var(--muted); }

  .task-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .rank-badge {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .status-progress .rank-badge { background: rgba(242,166,61,0.15); color: var(--warn); }
  .status-done .rank-badge { background: rgba(34,197,138,0.15); color: var(--success); }
  .task-title {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    word-break: break-word;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .task input.title-edit {
    flex: 1;
    padding: 6px 10px;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
  }
  .task input.title-edit:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

  .task-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-left: 36px;
    margin-top: -6px;
  }
  .task-meta .dot { opacity: 0.5; }

  /* Notes — inline, no card-in-card */
  .notes { display: flex; flex-direction: column; gap: 10px; padding-left: 36px; }
  .note-block { display: flex; flex-direction: column; gap: 5px; position: relative; }
  .note-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .note-label .saved-indicator {
    font-size: 10px;
    color: var(--success);
    opacity: 0;
    transition: opacity 0.2s;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
  }
  .note-label .saved-indicator.visible { opacity: 1; }
  .note-label .saved-indicator.saving { color: var(--muted); }

  .note-view {
    background: var(--panel-2);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    color: var(--text-2);
    white-space: pre-wrap;
    border-left: 2px solid var(--accent);
  }
  .note-view.tech { border-left-color: var(--warn); }

  .note-input {
    background: transparent;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    resize: vertical;
    min-height: 36px;
    line-height: 1.5;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  .note-input:hover { border-color: var(--border); }
  .note-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--panel-2);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .note-input::placeholder { color: var(--muted); opacity: 0.7; }

  /* Actions row */
  .task-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    padding-left: 36px;
    padding-top: 2px;
  }
  .task-actions .spacer { flex: 1; }

  .btn {
    padding: 7px 14px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover { background: var(--border-soft); border-color: var(--border); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn:disabled:hover { background: var(--panel-2); border-color: var(--border-soft); }

  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.success { background: var(--success); border-color: var(--success); color: white; }
  .btn.success:hover { filter: brightness(1.1); }

  .btn.icon {
    width: 32px;
    height: 32px;
    padding: 0;
    justify-content: center;
    color: var(--muted);
  }
  .btn.icon:hover { color: var(--text); }
  .btn.icon.danger:hover { color: var(--danger); border-color: rgba(239,90,90,0.4); }

  .btn.icon svg { width: 16px; height: 16px; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 20px;
    font-size: 14px;
    background: var(--panel);
    border: 1px dashed var(--border-soft);
    border-radius: 14px;
  }

  /* Mobile tweaks */
  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    header .who { display: none; }
    main { padding: 18px 14px 60px; }
    .task { padding: 12px 14px 10px; }
    .task-meta, .notes, .task-actions { padding-left: 34px; }
    .btn { padding: 8px 14px; }
    .btn.icon { width: 34px; height: 34px; }
  }

  .setup-notice {
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.4);
    color: var(--warn);
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.5;
  }
  .setup-notice code {
    background: rgba(0,0,0,0.3);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Tech Tasks</h1>
    <p class="sub">Sign in to continue</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="loginBtn">Sign in</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h1>Tech Tasks</h1>
    <span class="role-badge" id="roleBadge">—</span>
    <span class="spacer"></span>
    <span class="who" id="whoLabel"></span>
    <button class="logout" id="logoutBtn">Sign out</button>
  </header>

  <main>
    <div id="setupNotice" class="setup-notice" style="display:none;"></div>

    <!-- Owner: add task -->
    <div class="add-card" id="addCard" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <input id="newTitle" type="text" placeholder="Assign a new task…" />
      <button id="addBtn">Add</button>
    </div>

    <div class="toolbar-row">
      <div class="tabs">
        <button class="tab active" data-filter="open">Open<span class="count" id="cntOpen">0</span></button>
        <button class="tab" data-filter="progress">In Progress<span class="count" id="cntProgress">0</span></button>
        <button class="tab" data-filter="done">Done<span class="count" id="cntDone">0</span></button>
        <button class="tab" data-filter="all">All<span class="count" id="cntAll">0</span></button>
      </div>
      <button id="clearDoneBtn" style="display:none;">Clear done</button>
    </div>

    <div class="task-list" id="taskList"></div>
  </main>
</div>

<!-- Firebase (modular v10 CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
    setPersistence, browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc,
    query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ============================================================
  // FIREBASE CONFIG — paste your values here (Step 3 of README)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDuU8D7PSVohXJtKZuJGPNhxFUlxtj30W0",
    authDomain: "prod-task-6fa06.firebaseapp.com",
    projectId: "prod-task-6fa06",
    storageBucket: "prod-task-6fa06.firebasestorage.app",
    messagingSenderId: "536109745887",
    appId: "1:536109745887:web:b2f4a5c3d0bbc9cb4c0b6a"
  };

  // ============================================================
  // USER IDS — after you create the two accounts, paste their
  // UIDs here so the app knows who is the owner and who is the tech.
  // Find UIDs at: Firebase console → Authentication → Users.
  // ============================================================
  const OWNER_UID = "a8gMRWQko4duduqBELcWwIni4sP2";
  const TECH_UID  = "QNMXBvA2z8QdM2Qh4CYzaR0Yr3h2";

  // ============================================================

  const notConfigured = firebaseConfig.apiKey.startsWith("PASTE");
  const notWired = OWNER_UID.startsWith("PASTE") || TECH_UID.startsWith("PASTE");

  const $ = (id) => document.getElementById(id);

  if (notConfigured) {
    $("setupNotice").style.display = "block";
    $("setupNotice").innerHTML =
      "<b>Setup needed.</b> Open <code>index.html</code> and paste your Firebase config values into <code>firebaseConfig</code>. See <code>SETUP.md</code>.";
    $("loginScreen").style.display = "none";
    $("app").style.display = "flex";
    // stop here — nothing to do until config is filled in
  } else {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    await setPersistence(auth, browserLocalPersistence);

    // ---------- Login ----------
    $("loginBtn").addEventListener("click", doLogin);
    $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

    async function doLogin() {
      const email = $("email").value.trim();
      const password = $("password").value;
      const btn = $("loginBtn");
      const err = $("loginError");
      err.textContent = "";
      if (!email || !password) { err.textContent = "Enter email and password."; return; }
      btn.disabled = true;
      btn.textContent = "Signing in...";
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        err.textContent = friendlyAuthError(e);
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    }

    function friendlyAuthError(e) {
      const c = e.code || "";
      if (c.includes("invalid") || c.includes("wrong-password") || c.includes("user-not-found"))
        return "Wrong email or password.";
      if (c.includes("network")) return "Network problem — check connection.";
      if (c.includes("too-many-requests")) return "Too many attempts. Wait a bit.";
      return e.message || "Sign-in failed.";
    }

    $("logoutBtn").addEventListener("click", () => signOut(auth));

    // ---------- State ----------
    let currentUser = null;
    let currentRole = null; // 'owner' | 'tech' | null
    let tasksUnsub = null;
    let tasks = [];
    let filter = "open";
    const editingIds = new Set(); // task ids currently in inline-edit mode

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (tasksUnsub) { tasksUnsub(); tasksUnsub = null; }
      if (!user) {
        $("loginScreen").style.display = "flex";
        $("app").style.display = "none";
        tasks = [];
        return;
      }
      // Determine role
      if (user.uid === OWNER_UID) currentRole = "owner";
      else if (user.uid === TECH_UID) currentRole = "tech";
      else currentRole = null;

      if (notWired) {
        // Config OK but UIDs not pasted yet — show helpful notice with this user's UID
        $("setupNotice").style.display = "block";
        $("setupNotice").innerHTML =
          "<b>Almost done.</b> Signed in as <code>" + escapeHtml(user.email) + "</code>. This account's UID is:<br><br><code>" +
          user.uid + "</code><br><br>Paste it into <code>OWNER_UID</code> or <code>TECH_UID</code> in <code>index.html</code>. See <code>SETUP.md</code>.";
      }

      if (!currentRole && !notWired) {
        $("setupNotice").style.display = "block";
        $("setupNotice").innerHTML = "This account isn't authorized. Sign out and use the owner or tech account.";
      }

      $("loginScreen").style.display = "none";
      $("app").style.display = "flex";
      $("whoLabel").textContent = user.email;
      $("roleBadge").textContent = currentRole || "unknown";
      $("addCard").style.display = currentRole === "owner" ? "block" : "none";

      subscribeTasks();
    });

    function subscribeTasks() {
      const q = query(collection(db, "tasks"), orderBy("createdAt", "desc"));
      tasksUnsub = onSnapshot(q, (snap) => {
        tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }, (err) => {
        console.error("tasks snapshot error:", err);
        $("taskList").innerHTML = '<div class="empty">Could not load tasks. Check Firestore rules.</div>';
      });
    }

    // ---------- Add task ----------
    $("addBtn").addEventListener("click", addTask);
    $("newTitle").addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });

    async function addTask() {
      const title = $("newTitle").value.trim();
      if (!title) return;
      // New task goes to the bottom of the open list.
      const openTasks = tasks.filter(t => t.status === "open");
      const maxOrder = openTasks.reduce((m, t) => Math.max(m, t.order ?? 0), 0);
      try {
        await addDoc(collection(db, "tasks"), {
          title,
          status: "open",
          ownerNote: "",  // owner-editable: instructions / details
          note: "",       // tech-editable: status / reply
          order: maxOrder + 1000,
          createdAt: serverTimestamp(),
          createdBy: currentUser.uid,
          startedAt: null,
          completedAt: null
        });
        $("newTitle").value = "";
        $("newTitle").focus();
      } catch (e) {
        alert("Could not add task: " + e.message);
      }
    }

    // ---------- Clear all done ----------
    $("clearDoneBtn").addEventListener("click", async () => {
      const done = tasks.filter(t => t.status === "done");
      if (!done.length) return;
      if (!confirm(`Delete all ${done.length} done task${done.length === 1 ? "" : "s"}?`)) return;
      try {
        await Promise.all(done.map(t => deleteDoc(doc(db, "tasks", t.id))));
      } catch (e) {
        alert("Could not clear done: " + e.message);
      }
    });

    // ---------- Filter tabs ----------
    document.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        filter = t.dataset.filter;
        render();
      });
    });

    // ---------- Render ----------
    function render() {
      const cntOpen = tasks.filter(t => t.status === "open").length;
      const cntProgress = tasks.filter(t => t.status === "progress").length;
      const cntDone = tasks.filter(t => t.status === "done").length;
      $("cntOpen").textContent = cntOpen;
      $("cntProgress").textContent = cntProgress;
      $("cntDone").textContent = cntDone;
      $("cntAll").textContent = tasks.length;

      // Show "Clear done" only on Done tab, for owner, when there are done tasks
      $("clearDoneBtn").style.display =
        (filter === "done" && currentRole === "owner" && cntDone > 0) ? "inline-flex" : "none";

      const filtered = filter === "all" ? tasks : tasks.filter(t => t.status === filter);
      const list = $("taskList");

      if (!filtered.length) {
        list.innerHTML = '<div class="empty">Nothing here.</div>';
        return;
      }

      // Sort:
      //   open      → by `order` ascending (owner-controlled priority; top = highest)
      //   progress  → by startedAt asc (oldest in-progress first)
      //   done      → by completedAt desc (most recent first)
      //   all       → open first (by order), then progress, then done
      const statusRank = { open: 0, progress: 1, done: 2 };
      const sorted = filtered.slice().sort((a, b) => {
        const sd = (statusRank[a.status] ?? 9) - (statusRank[b.status] ?? 9);
        if (sd !== 0) return sd;
        if (a.status === "open") {
          return (a.order ?? Number.MAX_SAFE_INTEGER) - (b.order ?? Number.MAX_SAFE_INTEGER);
        }
        if (a.status === "progress") {
          return (a.startedAt?.seconds || 0) - (b.startedAt?.seconds || 0);
        }
        // done
        return (b.completedAt?.seconds || 0) - (a.completedAt?.seconds || 0);
      });

      // Compute open-list positions for up/down arrow enabling & rank number
      const openSorted = sorted.filter(t => t.status === "open");
      const openIdx = new Map(openSorted.map((t, i) => [t.id, i]));

      // Preserve focus & selection across re-render (so autosave doesn't yank the user out of a textarea)
      const active = document.activeElement;
      let focusKey = null, selStart = 0, selEnd = 0, scrollTop = 0;
      if (active && active.tagName === "TEXTAREA") {
        if (active.dataset.ownerNoteId) focusKey = ["owner", active.dataset.ownerNoteId];
        else if (active.dataset.noteId) focusKey = ["tech", active.dataset.noteId];
        if (focusKey) {
          selStart = active.selectionStart;
          selEnd = active.selectionEnd;
          scrollTop = active.scrollTop;
        }
      }

      list.innerHTML = sorted.map(t => renderTask(t, openIdx, openSorted.length)).join("");
      wireTaskActions();

      if (focusKey) {
        const attr = focusKey[0] === "owner" ? "data-owner-note-id" : "data-note-id";
        const restored = document.querySelector(`textarea[${attr}="${focusKey[1]}"]`);
        if (restored) {
          restored.focus();
          try { restored.setSelectionRange(selStart, selEnd); } catch (_) {}
          restored.scrollTop = scrollTop;
        }
      }
    }

    function renderTask(t, openIdx, openCount) {
      const created = fmtDate(t.createdAt);
      const started = t.startedAt ? "Started " + fmtDate(t.startedAt) : "";
      const done = t.completedAt ? "Done " + fmtDate(t.completedAt) : "";
      const isOwner = currentRole === "owner";
      const isTech = currentRole === "tech";

      const idx = openIdx.get(t.id);
      const isOpen = t.status === "open";
      const canUp = isOpen && idx !== undefined && idx > 0;
      const canDown = isOpen && idx !== undefined && idx < openCount - 1;

      const editing = editingIds.has(t.id);

      // Rank badge on left of card — number for open, dot for other states
      let badgeText = "•";
      if (isOpen && idx !== undefined) badgeText = String(idx + 1);
      else if (t.status === "progress") badgeText = "▶";
      else if (t.status === "done") badgeText = "✓";
      const badgeHtml = `<span class="rank-badge">${badgeText}</span>`;

      // Primary + secondary actions
      let primary = "", secondary = "";
      if (editing) {
        primary = `<button class="btn primary" data-act="save-title" data-id="${t.id}">Save</button>
                   <button class="btn" data-act="cancel-edit" data-id="${t.id}">Cancel</button>`;
      } else if (isOpen) {
        if (isTech) {
          primary = `<button class="btn primary" data-act="start" data-id="${t.id}">Start</button>
                     <button class="btn" data-act="done" data-id="${t.id}">Mark done</button>`;
        }
        if (isOwner) {
          secondary =
            `<button class="btn icon" title="Move up" data-act="up" data-id="${t.id}" ${canUp ? "" : "disabled"}>${icoUp()}</button>` +
            `<button class="btn icon" title="Move down" data-act="down" data-id="${t.id}" ${canDown ? "" : "disabled"}>${icoDown()}</button>` +
            `<button class="btn icon" title="Edit" data-act="edit" data-id="${t.id}">${icoPencil()}</button>` +
            `<button class="btn icon danger" title="Delete" data-act="delete" data-id="${t.id}">${icoTrash()}</button>`;
        }
      } else if (t.status === "progress") {
        if (isTech) {
          primary = `<button class="btn success" data-act="done" data-id="${t.id}">Mark done</button>
                     <button class="btn" data-act="reopen" data-id="${t.id}">Back to open</button>`;
        }
        if (isOwner) {
          secondary =
            `<button class="btn icon" title="Edit" data-act="edit" data-id="${t.id}">${icoPencil()}</button>` +
            `<button class="btn icon danger" title="Delete" data-act="delete" data-id="${t.id}">${icoTrash()}</button>`;
        }
      } else if (t.status === "done") {
        primary = `<button class="btn" data-act="reopen" data-id="${t.id}">Reopen</button>`;
        if (isOwner) {
          secondary =
            `<button class="btn icon" title="Edit" data-act="edit" data-id="${t.id}">${icoPencil()}</button>` +
            `<button class="btn icon danger" title="Delete" data-act="delete" data-id="${t.id}">${icoTrash()}</button>`;
        }
      }

      // Notes — inline, no card-in-card, autosaved
      let ownerNoteHtml = "";
      if (isOwner) {
        ownerNoteHtml = `
          <div class="note-block">
            <div class="note-label">Details <span class="saved-indicator" data-saved-for="owner-${t.id}"></span></div>
            <textarea class="note-input" data-owner-note-id="${t.id}" placeholder="Kit them first. Should be 3 lefts and 3 rights…">${escapeHtml(t.ownerNote || "")}</textarea>
          </div>`;
      } else if (t.ownerNote) {
        ownerNoteHtml = `
          <div class="note-block">
            <div class="note-label">Instructions</div>
            <div class="note-view">${escapeHtml(t.ownerNote)}</div>
          </div>`;
      }

      let techNoteHtml = "";
      if (isTech) {
        techNoteHtml = `
          <div class="note-block">
            <div class="note-label">Your notes <span class="saved-indicator" data-saved-for="tech-${t.id}"></span></div>
            <textarea class="note-input" data-note-id="${t.id}" placeholder="On hold, waiting on Bob…">${escapeHtml(t.note || "")}</textarea>
          </div>`;
      } else if (t.note) {
        techNoteHtml = `
          <div class="note-block">
            <div class="note-label">Tech notes</div>
            <div class="note-view tech">${escapeHtml(t.note)}</div>
          </div>`;
      }

      const notesHtml = (ownerNoteHtml || techNoteHtml)
        ? `<div class="notes">${ownerNoteHtml}${techNoteHtml}</div>`
        : "";

      const metaBits = [
        created ? `Added ${created}` : "",
        started ? started : "",
        done ? done : ""
      ].filter(Boolean).map((s, i) => (i > 0 ? `<span class="dot">•</span>` : "") + `<span>${s}</span>`).join(" ");

      const titleHtml = editing
        ? `<input class="title-edit" data-edit-id="${t.id}" type="text" value="${escapeHtml(t.title)}" />`
        : `<div class="task-title">${escapeHtml(t.title)}</div>`;

      const actionsHtml = (primary || secondary)
        ? `<div class="task-actions">${primary}<span class="spacer"></span>${secondary}</div>`
        : "";

      return `
        <div class="task status-${t.status}">
          <div class="task-header">
            ${badgeHtml}
            ${titleHtml}
          </div>
          ${metaBits ? `<div class="task-meta">${metaBits}</div>` : ""}
          ${notesHtml}
          ${actionsHtml}
        </div>
      `;
    }

    // Icon helpers — small inline SVGs
    function icoUp()     { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`; }
    function icoDown()   { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`; }
    function icoPencil() { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`; }
    function icoTrash()  { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 012-2h2a2 2 0 012 2v2"/></svg>`; }

    // Debounced autosave for notes
    const saveTimers = new Map();
    function scheduleSave(taskId, field, value, kind) {
      const key = `${kind}-${taskId}`;
      const indicator = document.querySelector(`[data-saved-for="${key}"]`);
      if (indicator) {
        indicator.textContent = "saving…";
        indicator.classList.add("visible", "saving");
      }
      clearTimeout(saveTimers.get(key));
      saveTimers.set(key, setTimeout(async () => {
        try {
          await updateDoc(doc(db, "tasks", taskId), { [field]: value });
          if (indicator) {
            indicator.textContent = "✓ saved";
            indicator.classList.remove("saving");
            indicator.classList.add("visible");
            setTimeout(() => indicator.classList.remove("visible"), 1200);
          }
        } catch (e) {
          if (indicator) {
            indicator.textContent = "save failed";
            indicator.classList.remove("saving");
          }
        }
      }, 700));
    }

    function wireTaskActions() {
      // Enter = save, Escape = cancel while editing a title
      document.querySelectorAll("input.title-edit").forEach(inp => {
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            document.querySelector(`button[data-act="save-title"][data-id="${inp.dataset.editId}"]`)?.click();
          } else if (e.key === "Escape") {
            document.querySelector(`button[data-act="cancel-edit"][data-id="${inp.dataset.editId}"]`)?.click();
          }
        });
      });

      // Autosave owner-notes
      document.querySelectorAll("textarea[data-owner-note-id]").forEach(ta => {
        ta.addEventListener("input", () => scheduleSave(ta.dataset.ownerNoteId, "ownerNote", ta.value, "owner"));
      });
      // Autosave tech-notes
      document.querySelectorAll("textarea[data-note-id]").forEach(ta => {
        ta.addEventListener("input", () => scheduleSave(ta.dataset.noteId, "note", ta.value, "tech"));
      });

      document.querySelectorAll("[data-act]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const act = btn.dataset.act;
          const ref = doc(db, "tasks", id);
          try {
            if (act === "start") {
              await updateDoc(ref, { status: "progress", startedAt: serverTimestamp() });
            } else if (act === "done") {
              await updateDoc(ref, { status: "done", completedAt: serverTimestamp() });
            } else if (act === "reopen") {
              await updateDoc(ref, { status: "open", startedAt: null, completedAt: null });
            } else if (act === "delete") {
              if (confirm("Delete this task?")) await deleteDoc(ref);
            } else if (act === "up" || act === "down") {
              await moveTask(id, act === "up" ? -1 : 1);
            } else if (act === "edit") {
              editingIds.add(id);
              render();
              const input = document.querySelector(`input.title-edit[data-edit-id="${id}"]`);
              if (input) { input.focus(); input.select(); }
              return;
            } else if (act === "cancel-edit") {
              editingIds.delete(id);
              render();
              return;
            } else if (act === "save-title") {
              const input = document.querySelector(`input.title-edit[data-edit-id="${id}"]`);
              const newTitle = (input?.value || "").trim();
              if (!newTitle) { alert("Title can't be empty."); return; }
              await updateDoc(ref, { title: newTitle });
              editingIds.delete(id);
              // render() will run automatically via the Firestore snapshot listener
            } else if (act === "save-note") {
              const ta = document.querySelector(`textarea[data-note-id="${id}"]`);
              await updateDoc(ref, { note: ta.value });
              btn.textContent = "Saved";
              setTimeout(() => { btn.textContent = "Save"; }, 1200);
            } else if (act === "save-owner-note") {
              const ta = document.querySelector(`textarea[data-owner-note-id="${id}"]`);
              await updateDoc(ref, { ownerNote: ta.value });
              btn.textContent = "Saved";
              setTimeout(() => { btn.textContent = "Save"; }, 1200);
            }
          } catch (e) {
            alert("Action failed: " + e.message);
          }
        });
      });
    }

    async function moveTask(id, direction) {
      // Swap `order` with the adjacent open task in the given direction (-1 up, +1 down).
      const openSorted = tasks
        .filter(t => t.status === "open")
        .slice()
        .sort((a, b) => (a.order ?? Number.MAX_SAFE_INTEGER) - (b.order ?? Number.MAX_SAFE_INTEGER));
      const idx = openSorted.findIndex(t => t.id === id);
      const swapIdx = idx + direction;
      if (idx < 0 || swapIdx < 0 || swapIdx >= openSorted.length) return;
      const a = openSorted[idx];
      const b = openSorted[swapIdx];
      // Backfill missing order values so swap always works.
      const orderA = a.order ?? (idx + 1) * 1000;
      const orderB = b.order ?? (swapIdx + 1) * 1000;
      try {
        await Promise.all([
          updateDoc(doc(db, "tasks", a.id), { order: orderB }),
          updateDoc(doc(db, "tasks", b.id), { order: orderA })
        ]);
      } catch (e) {
        alert("Could not move: " + e.message);
      }
    }

    function fmtDate(ts) {
      if (!ts || !ts.seconds) return "";
      const d = new Date(ts.seconds * 1000);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " +
             d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
  }

  // Register service worker for PWA install
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
