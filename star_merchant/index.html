<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Merchant of the Stars</title>
<meta name="description" content="A space trading game: buy low, sell high, dodge pirates, become a Merchant Prince">
<meta name="theme-color" content="#0b0f24">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f24;
  --panel: rgba(20, 26, 58, .82);
  --panel-2: rgba(32, 40, 84, .9);
  --line: rgba(140, 160, 255, .16);
  --text: #e8ecff;
  --muted: #8f99c8;
  --cyan: #4fd8ff;
  --amber: #ffbf3d;
  --green: #3ddc97;
  --red: #ff5c75;
  --violet: #a27bff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  background: radial-gradient(1200px 700px at 70% 10%, #23205a 0%, transparent 60%), radial-gradient(900px 600px at 10% 90%, #0f3550 0%, transparent 60%), var(--bg);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.emo { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
.num { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; height: 100vh; height: 100dvh; }

/* header */
header.top { display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: rgba(8, 11, 30, .7); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 38px; height: 38px; flex: none; }
.bt { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: .95rem; letter-spacing: .04em; white-space: nowrap; }
.rank { font-size: .78rem; color: var(--amber); cursor: pointer; }
.hstats { flex: 1; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.hs { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 11px; min-width: 92px; }
.hs .k { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hs .v { font-weight: 700; font-size: .98rem; white-space: nowrap; }
.hs.cred .v { color: var(--amber); }
.hs.debt .v { color: var(--red); }
.hs.debt.clear .v { color: var(--green); }
.meter { height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); margin-top: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--cyan); transition: width .3s; }
.meter.low i { background: var(--red); }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none; }

.news { display: flex; gap: 10px; align-items: center; padding: 6px 18px; font-size: .84rem; color: var(--muted); border-bottom: 1px solid var(--line); background: rgba(8, 11, 30, .45); white-space: nowrap; overflow: hidden; }
.news b { color: var(--cyan); font-weight: 600; letter-spacing: .06em; font-size: .72rem; }
.news span { overflow: hidden; text-overflow: ellipsis; }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(380px, 1fr); min-height: 0; }
.mapwrap { position: relative; min-height: 0; overflow: hidden; }
#map { width: 100%; height: 100%; display: block; }
.planet { cursor: pointer; }
.planet .halo { fill: none; stroke: var(--cyan); stroke-width: 2; opacity: 0; }
.planet.sel .halo { opacity: 1; stroke-dasharray: 6 5; animation: rot 8s linear infinite; transform-box: fill-box; transform-origin: center; }
.planet.here .halo { opacity: 1; stroke: var(--amber); stroke-dasharray: none; animation: none; }
.planet.far .body { opacity: .45; }
.planet text { fill: var(--text); font-size: 15px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: rgba(5, 8, 25, .85); stroke-width: 4px; pointer-events: none; }
.planet text.sub { font-size: 11px; fill: var(--muted); font-weight: 500; }
.planet:hover .body { filter: brightness(1.25); }
.danger-dot { pointer-events: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.route { stroke: var(--cyan); stroke-width: 2; stroke-dasharray: 7 7; fill: none; opacity: .8; animation: dash 1s linear infinite; }
.route.bad { stroke: var(--red); }
@keyframes dash { to { stroke-dashoffset: -14; } }
.lanes line { stroke: rgba(140,160,255,.07); stroke-width: 1; }

.dest { position: absolute; left: 16px; right: 16px; bottom: 16px; max-width: 460px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: none; box-shadow: 0 12px 40px rgba(0,0,0,.45); backdrop-filter: blur(8px); }
.dest.on { display: block; animation: up .2s ease-out; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } }
.dest h3 { font-family: 'Orbitron', sans-serif; font-size: 1rem; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.dest .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin: 6px 0 8px; }
.dest .meta b { color: var(--text); }
.kp { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 4px 12px; font-size: .8rem; margin-bottom: 10px; max-height: 120px; overflow-y: auto; }
.kp div { display: flex; justify-content: space-between; gap: 6px; }
.kp .hold { color: var(--amber); }
.dest .row { display: flex; gap: 8px; }

/* panel */
.panel { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: rgba(10, 14, 36, .55); }
.phead { padding: 14px 16px 10px; }
.phead h2 { font-family: 'Orbitron', sans-serif; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
.phead .pt { font-size: .8rem; color: var(--muted); margin-top: 3px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: .72rem; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid var(--line); }
.tag.law3 { color: var(--cyan); } .tag.law0 { color: var(--red); }
.tag.dng2, .tag.dng3 { color: var(--red); }
.tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 9px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; position: relative; }
.tabs button.on { color: var(--text); border-bottom-color: var(--cyan); }
.tabs button .dot { position: absolute; top: 7px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); display: none; }
.tabs button .dot.on { display: block; }
.tabbody { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 14px 30px; min-height: 0; }

/* market */
.mkt { width: 100%; border-collapse: collapse; font-size: .9rem; }
.mkt th { text-align: right; font-size: .64rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 4px 6px 8px; }
.mkt th:first-child, .mkt td:first-child { text-align: left; }
.mkt td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
.mkt tr.g { cursor: pointer; }
.mkt tr.g:hover td { background: rgba(79, 216, 255, .06); }
.mkt tr.na td { color: #59618a; cursor: default; }
.mkt .gn { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.mkt .ill { font-size: .62rem; color: var(--red); border: 1px solid rgba(255,92,117,.4); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.pct { font-size: .7rem; display: block; }
.pct.lo { color: var(--green); } .pct.hi { color: var(--red); }
.held { color: var(--amber); font-weight: 600; }
.best { font-size: .74rem; color: var(--muted); line-height: 1.25; }
.best b { display: block; }
.best b { color: var(--green); font-weight: 600; }
.fuelrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.03); flex-wrap: wrap; }

.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; background: var(--cyan); color: #04202c; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn:disabled { background: rgba(255,255,255,.1); color: #6b739c; cursor: default; }
.btn.amber { background: var(--amber); color: #2a1a00; }
.btn.red { background: var(--red); color: #fff; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); }
.btn.green { background: var(--green); color: #032316; }
.btn.sm { padding: 6px 10px; font-size: .82rem; }
.btn.wide { flex: 1; }

.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: rgba(255,255,255,.03); margin-bottom: 10px; }
.card h4 { font-size: .98rem; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card p, .card .d { font-size: .84rem; color: var(--muted); line-height: 1.45; margin-top: 3px; }
.card .act { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.card.mine { border-color: rgba(255,191,61,.45); }
.card.cur { border-color: rgba(79,216,255,.55); }
.sec { font-family: 'Orbitron', sans-serif; font-size: .78rem; letter-spacing: .1em; color: var(--muted); margin: 16px 2px 8px; text-transform: uppercase; }
.sec:first-child { margin-top: 2px; }
.specs { display: flex; gap: 10px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin-top: 6px; }
.specs b { color: var(--text); }
.ok { color: var(--green); font-weight: 600; font-size: .85rem; }
.bad { color: var(--red); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.kv span:last-child { font-weight: 600; }
.ranks .r { display: flex; justify-content: space-between; padding: 6px 4px; font-size: .86rem; color: var(--muted); }
.ranks .r.done { color: var(--text); }
.ranks .r.cur { color: var(--amber); font-weight: 700; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ach { border: 1px solid var(--line); border-radius: 12px; padding: 9px; font-size: .78rem; color: var(--muted); }
.ach b { display: block; color: var(--text); font-size: .85rem; }
.ach.no { opacity: .4; }
.log div { font-size: .82rem; color: var(--muted); padding: 5px 0; border-bottom: 1px solid var(--line); }
.log div i { color: #5d679a; font-style: normal; margin-right: 6px; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(3, 5, 18, .7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal-bg.on { display: flex; }
.modal { background: #151b40; border: 1px solid var(--line); border-radius: 20px; padding: 22px; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: mpop .22s cubic-bezier(.2,1.3,.5,1); }
@keyframes mpop { from { transform: scale(.9); opacity: 0; } }
.modal .mi { font-size: 2.8rem; text-align: center; }
.modal h3 { font-family: 'Orbitron', sans-serif; font-size: 1.15rem; text-align: center; margin: 4px 0 8px; }
.modal p { color: var(--muted); line-height: 1.5; font-size: .92rem; }
.modal p + p { margin-top: 8px; }
.modal .btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.modal .btns .btn { flex: 1; }
.modal .big { text-align: center; font-size: 1.5rem; font-weight: 700; margin: 8px 0; }
.modal textarea { width: 100%; height: 100px; margin-top: 10px; border-radius: 10px; border: 1px solid var(--line); background: #0d1230; color: var(--text); padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: .72rem; resize: none; }
.seg { display: flex; background: rgba(255,255,255,.06); border-radius: 10px; padding: 3px; margin: 10px 0; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--cyan); color: #04202c; }
.seg button.on.sell { background: var(--amber); color: #2a1a00; }
input[type=range] { width: 100%; accent-color: var(--cyan); margin: 10px 0 4px; }
.qtyrow { display: flex; gap: 6px; }
.qtyrow button { flex: 1; }
.tsum { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: .9rem; margin-top: 10px; }
.tsum span:nth-child(even) { text-align: right; font-weight: 600; }
.tsum .tot { font-size: 1.1rem; color: var(--text); }
.hint { font-size: .8rem; color: var(--muted); margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.04); }
.bars { display: grid; gap: 8px; margin: 12px 0; }
.bar { font-size: .78rem; color: var(--muted); }
.bar .tr { height: 10px; border-radius: 5px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 3px; }
.bar .tr i { display: block; height: 100%; transition: width .3s; }
.clog { font-size: .84rem; color: var(--muted); min-height: 3.2em; margin-top: 6px; }
.clog div:last-child { color: var(--text); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* toasts */
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; align-items: flex-end; }
.toast { background: #1d2557; border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; font-size: .88rem; max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.good { border-color: rgba(61,220,151,.5); }
.toast.bad { border-color: rgba(255,92,117,.6); }
.toast.gold { border-color: rgba(255,191,61,.6); }
.toast.out { animation: tout .3s forwards; }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } }
@keyframes tout { to { opacity: 0; transform: translateX(20px); } }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 44vh 1fr; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .hstats { gap: 5px; }
  .hs { min-width: 0; padding: 4px 8px; }
  .hs .v { font-size: .84rem; }
  .bt { display: none; }
  .mkt .col-best { display: none; }
  .dest { left: 8px; right: 8px; bottom: 8px; padding: 10px 12px; }
  .kp { max-height: 70px; }
  .toasts { left: 12px; right: 12px; align-items: stretch; }
  .toast { max-width: none; }
}
@media (max-width: 560px) {
  header.top { padding: 8px 10px; gap: 6px; }
  .brand .rank { display: none; }
  .brand img { width: 30px; height: 30px; }
  .hstats { flex-wrap: nowrap; gap: 4px; min-width: 0; }
  .hs { flex: 1; min-width: 0; padding: 4px 6px; }
  .hs .k { font-size: .58rem; }
  .hs .v { font-size: .74rem; overflow: hidden; text-overflow: ellipsis; }
  .hs.day, .hs.hull { display: none; }
  .iconbtn { width: 32px; height: 32px; }
  .news { padding: 5px 10px; font-size: .76rem; }
  .main { grid-template-rows: 42vh 1fr; }
  .dest { padding: 9px 11px; }
  .dest h3 { font-size: .88rem; }
  .dest .meta { gap: 8px; font-size: .74rem; margin: 4px 0 6px; }
  .kp { grid-template-columns: 1fr 1fr; max-height: 52px; font-size: .72rem; margin-bottom: 7px; }
  .dest .btn { padding: 7px 12px; }
  .mkt { font-size: .82rem; }
  .mkt .pct { font-size: .64rem; }
  .mkt .gn { gap: 5px; }
  .mkt .ill { display: none; }
  .phead { padding: 10px 12px 6px; }
  .phead .pt { display: none; }
  .tabbody { padding: 10px 10px 30px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt=""><div><div class="bt">Merchant of the Stars</div><div class="rank" id="rank"></div></div></div>
    <div class="hstats">
      <div class="hs cred"><div class="k">Credits</div><div class="v num" id="hCred"></div></div>
      <div class="hs debt" id="hsDebt"><div class="k">Debt</div><div class="v num" id="hDebt"></div></div>
      <div class="hs day"><div class="k">Day</div><div class="v num" id="hDay"></div></div>
      <div class="hs"><div class="k">Fuel</div><div class="v num" id="hFuel"></div><div class="meter" id="mFuelW"><i id="mFuel"></i></div></div>
      <div class="hs hull"><div class="k">Hull</div><div class="v num" id="hHull"></div><div class="meter" id="mHullW"><i id="mHull"></i></div></div>
      <div class="hs"><div class="k">Cargo</div><div class="v num" id="hCargo"></div><div class="meter"><i id="mCargo"></i></div></div>
    </div>
    <button class="iconbtn emo" id="muteBtn" title="Sound" aria-label="Toggle sound">🔊</button>
  </header>
  <div class="news"><b>NEWS</b><span id="news">Markets open across the sector.</span></div>
  <div class="main">
    <section class="mapwrap">
      <svg id="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-label="Star map"></svg>
      <div class="dest" id="dest"></div>
    </section>
    <section class="panel">
      <div class="phead" id="phead"></div>
      <nav class="tabs" id="tabs"></nav>
      <div class="tabbody" id="tabbody"></div>
    </section>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
// ═════════════════════════ DATA ═════════════════════════
const GOODS = [
  { id: 'water',       name: 'Water',           icon: '💧', base: 20 },
  { id: 'food',        name: 'Food',            icon: '🌽', base: 45 },
  { id: 'ore',         name: 'Ore',             icon: '🪨', base: 90 },
  { id: 'textiles',    name: 'Textiles',        icon: '🧵', base: 140 },
  { id: 'medicine',    name: 'Medicine',        icon: '💊', base: 320 },
  { id: 'machinery',   name: 'Machinery',       icon: '⚙️', base: 480 },
  { id: 'electronics', name: 'Electronics',     icon: '💾', base: 750 },
  { id: 'luxury',      name: 'Luxury Goods',    icon: '💎', base: 1300 },
  { id: 'weapons',     name: 'Weapons',         icon: '🔫', base: 1700, illegal: true },
  { id: 'stims',       name: 'Stims',           icon: '💉', base: 2600, illegal: true },
  { id: 'artifacts',   name: 'Alien Artifacts', icon: '🗿', base: 6500 },
];
const G = Object.fromEntries(GOODS.map(g => [g.id, g]));

// mods: price multiplier vs galactic base. 0 = not traded here. Illegal goods aren't traded where law >= 2.
const PLANETS = [
  { id: 'terra', name: 'Terra Nova', type: 'Capital world', x: 500, y: 300, r: 26, c: ['#9fe3ff', '#2a6fd6'], law: 3, danger: 0, fuel: 1.1, bank: true, yard: true,
    desc: 'The sector capital. Strict customs, deep pockets, and the bank that holds your debt.',
    mods: { water: 1.15, food: 1.2, ore: 1.25, textiles: 1.1, medicine: 0.95, machinery: 1.05, electronics: 1.05, luxury: 1.25, artifacts: 1.6 } },
  { id: 'helios', name: 'Helios Station', type: 'Solar refinery', x: 385, y: 170, r: 15, c: ['#fff2a8', '#ff9a2e'], law: 2, danger: 0, fuel: 0.45,
    desc: 'A refinery skimming plasma off a blue giant. The cheapest fuel in the sector.',
    mods: { water: 1.35, food: 1.3, ore: 1.2, textiles: 1.2, medicine: 1.15, machinery: 0.95, electronics: 1.1, luxury: 1.1, artifacts: 0 } },
  { id: 'verdant', name: 'Verdant', type: 'Agricultural world', x: 625, y: 175, r: 21, c: ['#b6f59a', '#2f9a4a'], law: 2, danger: 0, fuel: 1,
    desc: 'Endless farms under a gentle sun. Food is cheap; machines are not.',
    mods: { water: 0.75, food: 0.45, ore: 1.2, textiles: 0.8, medicine: 1.3, machinery: 1.45, electronics: 1.35, luxury: 1.1, artifacts: 0 } },
  { id: 'neon', name: 'Neon Reach', type: 'Tech hub', x: 655, y: 385, r: 19, c: ['#ff9ff0', '#7a3cff'], law: 2, danger: 0, fuel: 1.05, yard: true,
    desc: 'A city-planet of chip foundries and collectors with money to burn.',
    mods: { water: 1.2, food: 1.3, ore: 1.45, textiles: 1.15, medicine: 0.85, machinery: 1.2, electronics: 0.5, luxury: 1.35, artifacts: 1.9 } },
  { id: 'forge', name: 'Forge Prime', type: 'Industrial world', x: 345, y: 405, r: 22, c: ['#ffb38a', '#a8402a'], law: 2, danger: 1, fuel: 0.95, yard: true,

const ship = () => SH[S.ship];

function traded(pid, gid) {
  const p = P[pid], g = G[gid];
  if (g.illegal && p.law >= 2) return false;
  const m = p.mods[gid];
  return m === undefined ? !g.illegal : m > 0;
}
function mod(pid, gid) { const m = P[pid].mods[gid]; return m === undefined ? 1 : m; }
function mid(pid, gid) { return traded(pid, gid) ? G[gid].base * mod(pid, gid) * S.drift[pid][gid] : 0; }
const unitBuy = (pid, gid) => mid(pid, gid) * (1 + SPREAD);

function fuelPrice(pid) { return Math.max(3, Math.round(14 * P[pid].fuel)); }
function cargoValue() { let v = 0; for (const g in S.cargo) v += S.cargo[g].q * G[g].base * .9; return v; }
function netWorth() { return S.credits + cargoValue() - S.debt; }
function rankIdx(nw = netWorth()) { let k = 0; RANKS.forEach((r, j) => { if (nw >= r[0]) k = j; }); return k; }

function dist(a, b) { const A = P[a], B = P[b]; return Math.hypot(A.x - B.x, A.y - B.y) / LY; }
function route(a, b) { const d = dist(a, b); return { d, fuel: Math.ceil(d), days: Math.max(1, Math.ceil(d / speed())) }; }

function recordKnown(pid) {
  const prices = {};
  for (const g of GOODS) prices[g.id] = mid(pid, g.id);
  S.known[pid] = { day: S.day, prices };
}
function knownPrice(pid, gid) {
  if (has('feed') || pid === S.loc) return { price: mid(pid, gid), day: S.day, live: true };
  const k = S.known[pid];
  return k ? { price: k.prices[gid] || 0, day: k.day } : null;
}
function bestElsewhere(gid) {
  let best = null;
  for (const p of PLANETS) {
    if (p.id === S.loc) continue;
    const k = knownPrice(p.id, gid);
    if (!k || !k.price) continue;
    const s = k.price * (1 - SPREAD);
    if (!best || s > best.price) best = { pid: p.id, price: s, age: S.day - k.day, live: k.live };
  }
  return best;
}

function dayTick() {
  S.day++;
  if (S.debt > 0) S.debt = Math.round(S.debt * (1 + INTEREST));
  for (const p of PLANETS) for (const g of GOODS) {
    let d = S.drift[p.id][g.id] * Math.exp(gauss() * .05);
    d += (1 - d) * .045;
    S.drift[p.id][g.id] = Math.min(3.5, Math.max(.35, d));
  }
  if (Math.random() < .14) newsEvent();
  if (has('scoop')) S.fuel = Math.min(ship().fuel, S.fuel + 1);
  for (const c of S.contracts.slice()) if (S.day > c.due) {
    S.contracts.splice(S.contracts.indexOf(c), 1);
    log(`❌ Contract expired: ${contractTitle(c)}`);
    toast(`❌ Contract expired: ${contractTitle(c)}`, 'bad');
  }
}
function newsEvent() {
  const p = pick(PLANETS), pool = GOODS.filter(g => traded(p.id, g.id));
  if (!pool.length) return;
  const g = pick(pool), up = Math.random() < .55;
  S.drift[p.id][g.id] *= up ? rnd(1.9, 2.8) : rnd(.35, .55);
  S.drift[p.id][g.id] = Math.min(3.5, Math.max(.35, S.drift[p.id][g.id]));
  S.news = pick(up ? NEWS.up : NEWS.down).replace('{p}', p.name).replace('{g}', g.name.toLowerCase());
  log(`📰 ${S.news}`);
}

function contractTitle(c) { return c.type === 'courier' ? `Courier package to ${P[c.dest].name}` : `${c.qty} ${G[c.good].name} to ${P[c.dest].name}`; }
function genBoard(pid) {
  const offers = [];
  const others = PLANETS.filter(p => p.id !== pid);
  for (let k = 0; k < 3; k++) {
    const dest = pick(others), r = route(pid, dest.id);
    const id = Math.random().toString(36).slice(2, 9);
    if (Math.random() < .45) {
      const units = rint(2, 5);
      const reward = Math.round((r.d * (95 + dest.danger * 75) + 150) * (1 + Math.min(4, netWorth() / 150000)) / 10) * 10;
      offers.push({ id, type: 'courier', from: pid, dest: dest.id, units, reward, due: S.day + Math.ceil(r.d / 2.4) + rint(3, 6) });
    } else {
      const pool = GOODS.filter(g => !g.illegal && traded(dest.id, g.id) && mod(dest.id, g.id) >= 1.15);
      if (!pool.length) continue;
      const g = pick(pool);
      const qty = Math.max(3, Math.round(capacity() * rnd(.2, .5) * Math.min(1, 1500 / g.base)));
      const reward = Math.round((qty * g.base * mod(dest.id, g.id) * rnd(1.45, 1.8) + r.d * 90) / 10) * 10;
      offers.push({ id, type: 'deliver', from: pid, dest: dest.id, good: g.id, qty, reward, due: S.day + Math.ceil(r.d / 2.4) + rint(5, 10) });
    }
  }
  S.boards[pid] = { day: S.day, offers };
}
function board(pid) { if (!S.boards[pid] || S.day - S.boards[pid].day >= 5) genBoard(pid); return S.boards[pid].offers; }

}

function el(tag, attrs, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

    if (p.id === 'terra' || p.id === 'opaline') el('ellipse', { cx: p.x, cy: p.y, rx: p.r * 1.7, ry: p.r * .45, fill: 'none', stroke: p.c[0], 'stroke-opacity': .5, 'stroke-width': 2, transform: `rotate(-18 ${p.x} ${p.y})`, 'pointer-events': 'none' }, g);
    const t = el('text', { x: p.x, y: p.y + p.r + 22 }, g); t.textContent = p.name;
    const s = el('text', { class: 'sub', x: p.x, y: p.y + p.r + 37 }, g); s.textContent = p.type;
    for (let k = 0; k < p.danger; k++) el('circle', { class: 'danger-dot', cx: p.x + p.r + 6 + k * 9, cy: p.y - p.r - 2, r: 3.2, fill: '#ff5c75' }, g);

  el('circle', { cx: 0, cy: 7, r: 2.5, fill: '#4fd8ff' }, sg);
  placeShip(P[S.loc].x, P[S.loc].y - P[S.loc].r - 18, 0);
}
function placeShip(x, y, ang) { $('#shipMark').setAttribute('transform', `translate(${x},${y}) rotate(${ang})`); }
function renderMap() {
  for (const p of PLANETS) {
    const g = $('#pl_' + p.id);
    g.classList.toggle('here', p.id === S.loc);
    g.classList.toggle('sel', p.id === selected);

  }

  } else line.setAttribute('d', '');

}
function selectPlanet(pid) {

  sfx.click();
  selected = pid === S.loc ? null : pid;
  renderMap(); renderDest();
}
function renderDest() {
  const d = $('#dest');

  const p = P[selected], r = route(S.loc, p.id), ok = r.fuel <= S.fuel;
  const k = has('feed') ? { day: S.day } : S.known[p.id];
  const age = k ? (has('feed') ? 'live prices' : S.day - k.day === 0 ? 'seen today' : `seen ${S.day - k.day} day${S.day - k.day > 1 ? 's' : ''} ago`) : 'never visited';
  const rows = GOODS.filter(g => traded(p.id, g.id)).map(g => {

    <div class="meta"><span><b>${r.d.toFixed(1)}</b> ly</span><span><b>${r.days}</b> day${r.days > 1 ? 's' : ''}</span><span class="${ok ? '' : 'bad'}"><b>${r.fuel}</b> fuel (have ${S.fuel})</span><span>${age}</span>${deliveries ? `<span class="ok">📦 ${deliveries} contract${deliveries > 1 ? 's' : ''} due here</span>` : ''}</div>

// ═════════════════════════ TRAVEL & ENCOUNTERS ═════════════════════════
function animateShip(a, b, f0, f1, ms) {
  return new Promise(res => {
    const A = P[a], B = P[b], ang = Math.atan2(B.y - A.y, B.x - A.x) * 180 / Math.PI + 90;
    const t0 = performance.now();
    function fr(t) {
      const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, f = f0 + (f1 - f0) * e;
      placeShip(A.x + (B.x - A.x) * f, A.y + (B.y - A.y) * f, ang);
      if (k < 1) requestAnimationFrame(fr); else res();
    }
    requestAnimationFrame(fr);
    setTimeout(res, ms + 400); // fallback if frames are paused
  });
}
async function travel(dest) {
  if (busy) return;
  const r = route(S.loc, dest);
  if (r.fuel > S.fuel) { sfx.nope(); return; }
  busy = true; selected = null; renderDest();
  const from = S.loc;
  S.fuel -= r.fuel;
  sfx.warp();
  renderAll();
  await animateShip(from, dest, 0, .5, 700);
  const enc = rollEncounter(from, dest, r);
  if (enc) { await enc(); }
  await animateShip(from, dest, .5, 1, 700);
  for (let k = 0; k < r.days; k++) dayTick();
  S.stats.trips++; S.stats.ly += r.d;
  arrive(dest);
  busy = false;
  renderAll(); save();
}
function arrive(pid) {
  S.loc = pid;
  if (!S.visited.includes(pid)) S.visited.push(pid);
  recordKnown(pid);
  board(pid);
  log(`🛬 Arrived at ${P[pid].name}`);
  const due = S.contracts.filter(c => c.dest === pid);
  for (const c of due) {
    if (c.type === 'courier') completeContract(c);
    else if (held(c.good) >= c.qty) toast(`📦 You can deliver <b>${c.qty} ${G[c.good].name}</b> here. Open Contracts.`, 'good');
    else toast(`📦 Contract here needs <b>${c.qty} ${G[c.good].name}</b> (you have ${held(c.good)}).`);
  }
  if (S.hull < ship().hull * .3) toast('🔧 Hull is low. Repair at the shipyard tab.', 'bad');
  tab = 'market';
  checkProgress();
}

function pirateTier() {
  const nw = Math.max(0, netWorth()), base = nw < 15e3 ? 0 : nw < 80e3 ? 1 : nw < 300e3 ? 2 : nw < 1.2e6 ? 3 : 4;
  return Math.max(0, Math.min(4, base - (Math.random() < .4 ? 1 : 0)));
}
function contrabandHeld() { return GOODS.filter(g => g.illegal).reduce((a, g) => a + held(g.id), 0); }
function rollEncounter(from, dest, r) {
  const A = P[from], B = P[dest];
  const danger = Math.max(A.danger, B.danger);
  const cargoV = cargoValue();
  const pPirate = Math.min(.55, .06 + danger * .11 + r.days * .015 + Math.min(.12, cargoV / 400000));
  const pPolice = B.law >= 2 ? (contrabandHeld() > 0 ? .3 + B.law * .07 : .06) : 0;
  const roll = Math.random();
  let acc = 0;
  if (roll < (acc += pPolice)) return () => police(B);
  if (roll < (acc += pPirate)) return () => combat(PIRATES[pirateTier()]);
  if (roll < (acc += .06)) return () => derelict();
  if (roll < (acc += .05)) return () => storm();
  if (roll < (acc += .045)) return () => distress();
  return null;
}

function bar(label, v, max, color) { return `<div class="bar">${label} <span class="num">${Math.max(0, Math.round(v))}/${max}</span><div class="tr"><i style="width:${Math.max(0, v / max * 100)}%;background:${color}"></i></div></div>`; }
function wreck() {
  S.stats.wrecks++;
  const lost = used();
  S.cargo = {};
  const lostC = S.contracts.filter(c => c.type === 'courier');
  S.contracts = S.contracts.filter(c => c.type !== 'courier');
  S.hull = Math.round(ship().hull * .25);
  for (let k = 0; k < 2; k++) dayTick();
  award('wreck');
  log(`💥 Ship wrecked. Lost ${lost} units of cargo${lostC.length ? ' and courier packages' : ''}.`);
  return info('💥', 'Ship disabled!', `<p>Your hull gave out. A salvage tug drags what's left of you to port two days later.</p><p>You lost <b>all cargo</b>${lostC.length ? ' and your courier packages' : ''}. The hull is patched to 25%.</p>`, 'Limp onward');
}
function combat(pir) {
  return new Promise(resolve => {
    let ehp = pir.hp, shield = shieldVal(), lines = [`A <b>${pir.name}</b> drops out of warp and locks weapons on you.`];
    const tribute = Math.max(150, Math.round(Math.max(S.credits * .18, cargoValue() * .25)));
    const fleeOdds = () => Math.max(.15, Math.min(.85, .3 + (speed() - 2.4) * .12 + (has('engine') ? .1 : 0) - PIRATES.indexOf(pir) * .03));
    sfx.alarm();
    function enemyFire() {
      let d = rint(pir.dmg[0], pir.dmg[1]);
      const absorbed = Math.min(shield, d); shield -= absorbed; d -= absorbed;
      S.hull -= d; sfx.hit();
      lines.push(absorbed ? `They hit you for ${d + absorbed} (${absorbed} absorbed by shields).` : `They hit you for ${d}.`);
      $('#modal').classList.remove('shake'); void $('#modal').offsetWidth; $('#modal').classList.add('shake');
    }
    function done(fn) { closeModal(); renderAll(); Promise.resolve(fn && fn()).then(resolve); }
    function draw() {
      setDismiss(false);
      $('#modal').innerHTML = `<div class="mi emo">🏴‍☠️</div><h3>${pir.name}</h3>
        <div class="bars">${bar('Your hull', S.hull, ship().hull, 'var(--cyan)')}${shieldVal() ? bar('Shields', shield, shieldVal(), 'var(--violet)') : ''}${bar('Pirate hull', ehp, pir.hp, 'var(--red)')}</div>
        <div class="clog">${lines.slice(-3).map(l => `<div>${l}</div>`).join('')}</div>
        <div class="btns">
          <button class="btn red" id="cFire">Fire (${weaponDmg()} dmg)</button>
          <button class="btn ghost" id="cFlee">Flee (${Math.round(fleeOdds() * 100)}%)</button>
          <button class="btn ghost" id="cPay">Pay ${cr(tribute)}</button>
        </div>`;
      $('#cFire').onclick = () => {
        const d = Math.round(weaponDmg() * rnd(.75, 1.25));
        ehp -= d; sfx.laser(); lines.push(`You hit the ${pir.name} for ${d}.`);
        if (ehp <= 0) {
          const loot = Math.round(pir.loot * rnd(.7, 1.3));
          S.credits += loot; S.stats.pirates++;
          award('pirate1'); if (S.stats.pirates >= 10) award('pirate10'); if (pir === PIRATES[4]) award('reaver');
          log(`⚔️ Destroyed a ${pir.name}, collected ${cr(loot)} bounty`);
          return done(() => info('🎆', 'Pirate destroyed!', `<p>You collect a bounty and salvage worth</p><div class="big" style="color:var(--green)">+${cr(loot)}</div>`, 'Continue'));
        }
        enemyFire();
        if (S.hull <= 0) return done(wreck);
        draw();
      };
      $('#cFlee').onclick = () => {
        if (Math.random() < fleeOdds()) { log(`💨 Escaped a ${pir.name}`); sfx.warp(); return done(() => { toast('💨 You punched the engines and got away.'); }); }
        lines.push('Escape failed!'); enemyFire();
        if (S.hull <= 0) return done(wreck);
        draw();
      };
      $('#cPay').onclick = () => {
        if (S.credits >= tribute) { S.credits -= tribute; log(`💸 Paid ${cr(tribute)} tribute to a ${pir.name}`); return done(() => toast(`💸 The pirates take ${cr(tribute)} and let you go.`, 'bad')); }
        // can't pay cash: they take cargo
        const taken = takeCargo(.5);
        log(`💸 Pirates seized ${taken} units of cargo`);
        return done(() => toast(`💸 Short on cash, the pirates seize ${taken} units of cargo.`, 'bad'));
      };
    }
    $('#modalBg').classList.add('on');
    modalResolve = null;
    draw();
  });
}
function takeCargo(frac) {
  let n = 0;
  for (const g in S.cargo) { const t = Math.ceil(S.cargo[g].q * frac); S.cargo[g].cost *= (S.cargo[g].q - t) / S.cargo[g].q; S.cargo[g].q -= t; n += t; if (S.cargo[g].q <= 0) delete S.cargo[g]; }
  return n;
}
async function police(B) {
  sfx.alarm();
  const hidden = has('hold') ? 20 : 0;
  const exposed = Math.max(0, contrabandHeld() - hidden);
  if (!exposed) {
    log(`👮 Customs scan near ${B.name}: clean`);
    return info('👮', 'Customs patrol', `<p>A ${B.name} patrol scans your hold${contrabandHeld() ? ' and somehow misses the hidden compartment' : ''}.</p><p>"All clear, captain. Fly safe."</p>`, 'Continue');
  }
  const value = GOODS.filter(g => g.illegal).reduce((a, g) => a + held(g.id) * G[g.id].base, 0);
  const fine = Math.max(1000, Math.round(value * .5));
  const bribe = Math.round(value * .3);
  setDismiss(false);
  const choice = await modal(`<div class="mi emo">👮</div><h3>Customs patrol</h3>
    <p>A ${B.name} patrol orders you to stand by for a scan. Your contraband will be found.</p>
    <p>If caught: everything illegal is seized plus a <b>${cr(fine)}</b> fine.</p>
    <div class="btns"><button class="btn ghost" id="pSub">Submit to scan</button><button class="btn amber" id="pBribe">Bribe ${cr(bribe)} (65%)</button><button class="btn red" id="pRun">Run for it</button></div>`,
    () => { $('#pSub').onclick = () => closeModal('sub'); $('#pBribe').onclick = () => closeModal('bribe'); $('#pRun').onclick = () => closeModal('run'); });
  const seize = (mult) => {
    for (const g of GOODS) if (g.illegal) delete S.cargo[g.id];
    const f = Math.round(fine * mult); S.credits -= f; if (S.credits < 0) { S.debt = Math.round(S.debt - S.credits); S.credits = 0; }
    log(`👮 Contraband seized and fined ${cr(f)}`);
    return info('🚨', 'Busted', `<p>Customs seize your contraband and fine you <b>${cr(f)}</b>${S.debt > 0 ? '. Anything you couldn\'t pay was added to your bank debt' : ''}.</p>`, 'Ouch');
  };
  if (choice === 'sub') return seize(1);
  if (choice === 'bribe') {
    if (S.credits >= bribe && Math.random() < .65) { S.credits -= bribe; log(`🤝 Bribed customs (${cr(bribe)})`); return info('🤝', 'Looking the other way', `<p>The officer pockets <b>${cr(bribe)}</b> and waves you through.</p>`, 'Continue'); }
    if (S.credits >= bribe) S.credits -= bribe;
    toast('The officer takes the bribe and scans you anyway.', 'bad');
    return seize(1.5);
  }
  const odds = Math.max(.2, Math.min(.8, .35 + (speed() - 2.4) * .15 + (has('engine') ? .1 : 0)));
  if (Math.random() < odds) { log('💨 Outran a customs patrol'); sfx.warp(); return info('💨', 'Clean getaway', '<p>You outrun the patrol and lose them in the asteroid traffic.</p>', 'Phew'); }
  const d = rint(10, 25); S.hull -= d; sfx.hit();
  if (S.hull <= 0) { S.hull = 1; }
  toast(`The patrol disables your engines (${d} hull damage).`, 'bad');
  return seize(2);
}
function derelict() {
  const roll = Math.random();
  if (roll < .5) {
    const g = pick(GOODS.filter(x => x.base < 2000)), n = Math.min(free(), rint(3, 12));
    if (n > 0) { addCargo(g.id, n, 0); log(`🛰️ Salvaged ${n} ${g.name} from a derelict`); return info('🛰️', 'Derelict freighter', `<p>You find a drifting freighter and haul <b>${n} ${g.name}</b> into your hold.</p>`, 'Nice'); }
  }
  if (roll < .62 && free() > 0) { addCargo('artifacts', 1, 0); log('🗿 Found an alien artifact in a derelict'); return info('🗿', 'Ancient wreck', '<p>Inside a wreck older than humanity you find an <b>alien artifact</b>. Collectors on Aurelia and Neon Reach pay a fortune.</p>', 'Incredible'); }
  const c = rint(300, 1500) * (1 + rankIdx()); S.credits += c;
  log(`🛰️ Salvaged ${cr(c)} from a derelict`);
  return info('🛰️', 'Derelict freighter', `<p>The cargo is gone, but you strip parts worth <b>${cr(c)}</b>.</p>`, 'Nice');
}
function storm() {
  let d = rint(6, 22); const a = Math.min(shieldVal(), d); d -= a;
  S.hull = Math.max(1, S.hull - d); sfx.hit();
  log(`☄️ Meteor storm: ${d} hull damage`);
  return info('☄️', 'Meteor storm', `<p>You fly straight into a debris field.${a ? ` Shields absorb ${a} damage.` : ''} The hull takes <b>${d}</b> damage.</p>`, 'Keep flying');
}
async function distress() {
  setDismiss(false);
  const help = await modal(`<div class="mi emo">🆘</div><h3>Distress signal</h3><p>A damaged transport is broadcasting an SOS. Helping will cost you a day.</p>
    <div class="btns"><button class="btn ghost" id="dNo">Ignore it</button><button class="btn" id="dYes">Help them</button></div>`,
    () => { $('#dNo').onclick = () => closeModal(false); $('#dYes').onclick = () => closeModal(true); });
  if (!help) return;
  dayTick();
  if (Math.random() < .72) {
    const c = rint(800, 2500) * (1 + rankIdx()); S.credits += c;

  }

// ═════════════════════════ ACTIONS ═════════════════════════
function addCargo(gid, n, cost) { const c = S.cargo[gid] || (S.cargo[gid] = { q: 0, cost: 0 }); c.q += n; c.cost += cost; }
function doBuy(gid, n) {
  n = Math.min(n, free(), maxAfford(S.loc, gid));
  if (n < 1) { sfx.nope(); return; }
  const total = buyTotal(S.loc, gid, n);
  S.credits -= total; addCargo(gid, n, total);
  S.drift[S.loc][gid] *= Math.pow(1 + IMPACT, n);
  recordKnown(S.loc);
  sfx.buy(); log(`🛒 Bought ${n} ${G[gid].name} for ${cr(total)}`);
  checkProgress(); renderAll(); save();
}
function doSell(gid, n) {
  n = Math.min(n, held(gid));
  if (n < 1) return;
  const total = sellTotal(S.loc, gid, n), c = S.cargo[gid], basis = c.cost * n / c.q, profit = total - basis;
  S.credits += total; c.cost -= basis; c.q -= n; if (c.q <= 0) delete S.cargo[gid];
  S.drift[S.loc][gid] *= Math.pow(1 - IMPACT, n);
  recordKnown(S.loc);
  S.stats.profit += profit; S.stats.best = Math.max(S.stats.best, profit);
  if (profit > 0) award('firstsale');
  if (profit >= 25000) award('bigsale');
  if (profit >= 250000) award('hugesale');
  if (G[gid].illegal) { S.stats.smuggled += n; award('smuggle'); }
  sfx.sell();
  log(`💰 Sold ${n} ${G[gid].name} for ${cr(total)} (${profit >= 0 ? '+' : ''}${cr(profit)})`);
  toast(`💰 Sold ${n} ${G[gid].name} · <b style="color:${profit >= 0 ? 'var(--green)' : 'var(--red)'}">${profit >= 0 ? '+' : ''}${cr(profit)}</b>`, profit >= 0 ? 'good' : 'bad');
  checkProgress(); renderAll(); save();
}
function tradeSheet(gid, mode) {
  const g = G[gid];

  let qty = 0;
  setDismiss(true);
  modal('<div></div>');
  const maxQ = () => mode === 'buy' ? Math.min(free(), maxAfford(S.loc, gid)) : held(gid);
  // Static layout per mode; update() only rewrites numbers so the slider keeps working while dragged.
  function build() {
    const mx = maxQ(); qty = mx;
    const best = bestElsewhere(gid);
    $('#modal').innerHTML = `<h3><span class="emo">${g.icon}</span> ${g.name}</h3>
      <div class="seg"><button id="tB" class="${mode === 'buy' ? 'on' : ''}">Buy</button><button id="tS" class="${mode === 'sell' ? 'on sell' : ''}" ${held(gid) ? '' : 'disabled'}>Sell (${held(gid)})</button></div>
      <input type="range" id="tR" min="0" max="${mx}" value="${qty}" ${mx ? '' : 'disabled'}>
      <div class="qtyrow"><button class="btn ghost sm" data-q="-10">−10</button><button class="btn ghost sm" data-q="-1">−1</button><button class="btn ghost sm" data-q="1">+1</button><button class="btn ghost sm" data-q="10">+10</button><button class="btn ghost sm" data-q="max">Max</button></div>
      <div class="tsum" id="tSum"></div>
      ${mode === 'buy' && !mx ? `<div class="hint bad">${free() < 1 ? 'Your hold is full.' : 'You can’t afford any.'}</div>` : ''}
      ${best ? `<div class="hint">Best known sell price: <b>${cr(best.price)}</b> at ${P[best.pid].name} (${best.live ? 'live' : best.age === 0 ? 'today' : best.age + ' days old'})</div>` : '<div class="hint">You haven’t seen this good priced anywhere else yet.</div>'}
      ${g.illegal ? '<div class="hint" style="color:var(--red)">Contraband: customs near lawful worlds will seize it.</div>' : ''}
      <div class="hint">Big orders move the market: each unit shifts the price about 0.3%.</div>
      <div class="btns"><button class="btn ghost" id="tX">Close</button><button class="btn ${mode === 'sell' ? 'amber' : ''}" id="tGo"></button></div>`;
    $('#tB').onclick = () => { mode = 'buy'; build(); };
    $('#tS').onclick = () => { mode = 'sell'; build(); };
    $('#tR').oninput = e => { qty = +e.target.value; update(); };

      $('#tR').value = qty; update();
    });
    $('#tX').onclick = () => closeModal();

  function update() {
    const total = mode === 'buy' ? buyTotal(S.loc, gid, qty) : sellTotal(S.loc, gid, qty);
    const c = S.cargo[gid], avg = c ? c.cost / c.q : 0, best = bestElsewhere(gid);
    let extra = '';
    if (mode === 'sell' && c) { const prof = total - avg * qty; extra = `<span>Profit</span><span style="color:${prof >= 0 ? 'var(--green)' : 'var(--red)'}">${prof >= 0 ? '+' : ''}${cr(prof)}</span>`; }
    if (mode === 'buy' && best && qty) { const est = best.price * qty - total; extra = `<span>Est. profit at ${P[best.pid].name}</span><span style="color:${est >= 0 ? 'var(--green)' : 'var(--red)'}">${est >= 0 ? '+' : ''}${cr(est)}</span>`; }
    $('#tSum').innerHTML = `<span>Quantity</span><span class="num">${qty}${mode === 'buy' ? ` (room for ${free()})` : ''}</span>
      <span>Avg price each</span><span class="num">${qty ? cr(total / qty) : '–'}</span>
      ${c ? `<span>You paid on average</span><span class="num">${cr(avg)}</span>` : ''}
      ${extra}
      <span class="tot">Total</span><span class="tot num">${cr(total)}</span>`;
    const go = $('#tGo'); go.disabled = !qty; go.textContent = `${mode === 'buy' ? 'Buy' : 'Sell'} ${qty}`;

}
function buyFuel(n) {
  const price = fuelPrice(S.loc);
  n = Math.min(n, ship().fuel - S.fuel, Math.floor(S.credits / price));
  if (n < 1) { sfx.nope(); return; }
  S.credits -= n * price; S.fuel += n; sfx.buy();
  renderAll(); save();
}
function repair(n) {
  const per = P[S.loc].yard ? 12 : 25;
  n = Math.min(n, ship().hull - S.hull, Math.floor(S.credits / per));
  if (n < 1) { sfx.nope(); return; }
  S.credits -= n * per; S.hull += n; sfx.buy();
  renderAll(); save();
}
async function buyShip(id) {
  const s = SH[id], trade = Math.round(ship().cost * .6), price = s.cost - trade;
  if (S.credits < price) { sfx.nope(); return; }
  if (used() > Math.round(s.cargo * (has('pods') ? 1.25 : 1))) { info('📦', 'Too much cargo', `<p>The ${s.name} can't hold everything you're carrying. Sell some cargo first.</p>`); return; }
  const extraW = S.weapons.length - s.slots;
  const ok = await confirmBox('🛸', `Buy the ${s.name}?`, `${cr(s.cost)} minus ${cr(trade)} trade-in for your ${ship().name} = <b>${cr(price)}</b>.${extraW > 0 ? ` It has fewer weapon slots, so ${extraW} weapon${extraW > 1 ? 's' : ''} will be sold for half price.` : ''}`, 'Buy ship', 'amber');
  if (!ok) return;
  S.credits -= price;
  while (S.weapons.length > s.slots) { const w = S.weapons.pop(); S.credits += EQ[w].cost / 2; }
  S.ship = id; S.hull = s.hull; S.fuel = Math.min(S.fuel, s.fuel);
  award('ship'); sfx.win();
  log(`🛸 Bought the ${s.name}`);
  toast(`🛸 Welcome aboard the <b>${s.name}</b>!`, 'gold');
  checkProgress(); renderAll(); save();
}
function buyEquip(id) {
  const e = EQ[id];
  if (S.credits < e.cost) { sfx.nope(); return; }
  if (e.kind === 'weapon') { if (S.weapons.length >= ship().slots) { sfx.nope(); return; } S.weapons.push(id); }
  else if (e.kind === 'shield') { if (S.shield) S.credits += EQ[S.shield].cost / 2; S.shield = id; }
  else { if (has(id)) return; S.mods.push(id); }
  S.credits -= e.cost; sfx.buy();
  log(`🔧 Installed ${e.name}`); toast(`🔧 Installed <b>${e.name}</b>`, 'good');
  renderAll(); save();
}
function sellWeapon(i) { const w = S.weapons.splice(i, 1)[0]; S.credits += EQ[w].cost / 2; sfx.sell(); renderAll(); save(); }
function acceptContract(o) {
  if (S.contracts.length >= 5) { info('📋', 'Too many contracts', '<p>You can hold at most 5 contracts at once.</p>'); return; }
  if (o.type === 'courier' && free() < o.units) { info('📦', 'No room', `<p>The package needs ${o.units} units of cargo space.</p>`); return; }
  S.contracts.push(o);
  S.boards[S.loc].offers = S.boards[S.loc].offers.filter(x => x.id !== o.id);
  sfx.buy(); log(`📋 Accepted: ${contractTitle(o)}`);
  renderAll(); save();
}
function completeContract(c) {
  if (c.type === 'deliver') {
    const cg = S.cargo[c.good]; if (!cg || cg.q < c.qty) return;
    cg.cost *= (cg.q - c.qty) / cg.q; cg.q -= c.qty; if (cg.q <= 0) delete S.cargo[c.good];
  }
  S.credits += c.reward; S.stats.contracts++;
  S.contracts = S.contracts.filter(x => x !== c);
  award('contract1'); if (S.stats.contracts >= 10) award('contract10');
  sfx.sell(); log(`✅ Contract complete: ${contractTitle(c)} (+${cr(c.reward)})`);
  toast(`✅ Contract complete · <b style="color:var(--green)">+${cr(c.reward)}</b>`, 'good');
  checkProgress(); renderAll(); save();
}
async function abandon(c) {
  const ok = await confirmBox('🗑️', 'Abandon contract?', `${contractTitle(c)}. ${c.type === 'courier' ? 'The package is returned to sender.' : ''}`, 'Abandon', 'red');
  if (!ok) return;
  S.contracts = S.contracts.filter(x => x !== c); renderAll(); save();
}
function bankBorrow(n) { const lim = loanLimit(); n = Math.min(n, lim); if (n < 1) return; S.debt += n; S.credits += n; sfx.buy(); log(`🏦 Borrowed ${cr(n)}`); renderAll(); save(); }
function bankRepay(n) { n = Math.min(n, S.debt, S.credits); if (n < 1) return; S.debt -= n; S.credits -= n; sfx.sell(); log(`🏦 Repaid ${cr(n)}`); checkProgress(); renderAll(); save(); }
function loanLimit() { return Math.max(0, Math.round(Math.max(8000, (S.credits + cargoValue()) * .6 + ship().cost * .3) - S.debt)); }
async function callTow() {
  const ok = await confirmBox('🛟', 'Call for a tow?', 'You can\'t afford fuel to reach any planet. A tug will refuel you to half a tank, and the 1,500 cr fee goes on your bank debt.', 'Call tug');

  on('imp', () => {
    setDismiss(true);
    modal(`<div class="mi emo">📥</div><h3>Import save</h3><p>Paste a save code. This replaces your current game.</p><textarea id="saveTxt"></textarea><div class="btns"><button class="btn ghost" id="mNo">Cancel</button><button class="btn" id="mOk">Import</button></div>`, () => {
      $('#mNo').onclick = () => closeModal();
      $('#mOk').onclick = () => {
        try { const d = JSON.parse(decodeURIComponent(escape(atob($('#saveTxt').value.trim())))); if (!d.loc || !P[d.loc]) throw 0; localStorage.setItem(SAVE_KEY, JSON.stringify(d)); location.reload(); }
        catch (e) { $('#saveTxt').style.borderColor = 'var(--red)'; }
      };
    });
  });
  on('wipe', async () => {
    if (!await confirmBox('🗑️', 'Start a new game?', 'This erases your current captain, ship and fortune.', 'Start over', 'red')) return;
    S = fresh(); S.seenIntro = true; recordKnown(S.loc); lastRank = 0; selected = null; save(); buildMap(); renderAll();
  });
}
function renderAll() { renderHeader(); renderMap(); renderPanel(); renderDest(); }

$('#muteBtn').onclick = () => { S.mute = !S.mute; renderHeader(); save(); };
$('#rank').onclick = () => { tab = 'captain'; renderPanel(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').dataset.dismiss !== 'no') closeModal(); });
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ═════════════════════════ BOOT ═════════════════════════
load();
if (!S.known[S.loc]) recordKnown(S.loc);
lastRank = rankIdx();
buildMap();
renderAll();
if (!S.seenIntro) {
  S.seenIntro = true; save();
  info('🚀', 'Merchant of the Stars', `<p>Your uncle left you two things: a rusty freighter called the <b>Mule</b>, and a <b>5,000 credit</b> debt to the Bank of Terra Nova that grows 1% every day.</p>
    <p><b>Buy low, sell high.</b> Every world produces some goods cheaply and is desperate for others. Tap a planet on the map to see what you last saw it paying, then jump there.</p>
    <p>Watch your fuel, dodge pirates (red dots mark dangerous systems), and keep contraband away from customs. Reach <b>1,000,000 credits</b> net worth to become a <b>Merchant Prince</b>.</p>`, 'Fire up the engines');
}

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
