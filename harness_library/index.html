<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Aerial harness library</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="application-name" content="Harness Library">
<meta name="theme-color" content="#1a1e20">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<style id="pagecss">
  * { box-sizing: border-box; }
  body { margin: 0; }
  img, svg { max-width: 100%; }
  [hidden] { display: none !important; }

  :root {
    --ground: #f2f2ef; --panel: #ffffff; --panel-2: #e9e9e4;
    --ink: #17191a; --ink-2: #4c5052; --ink-3: #7a7f81;
    --rule: #d4d5d0; --rule-strong: #b4b6b0;
    --edit: #1f5f8b; --edit-soft: #dbeaf4;
    --wire-edge: #6c7073;
    --hsg-hi: #f4f4f2; --hsg-lo: #c8cac4; --hsg-edge: #94968f;
    --cav: #3a3f41; --cav-edge: #23282a; --cav-text: #f0f2f1;
    --xt-hi: #f2c53d; --xt-lo: #d39f14; --xt-edge: #8a6708;
    --iec-hi: #5b6064; --iec-lo: #34383b; --iec-edge: #15181a; --iec-slot: #141719;
    --qd-hi: #7fd36f; --qd-lo: #3f9a3c; --qd-edge: #2a6b28;
    --shadow: 0 1px 2px rgba(20,22,24,.05), 0 10px 26px rgba(20,22,24,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131515; --panel: #1c1e1f; --panel-2: #242727;
      --ink: #e8eaea; --ink-2: #a8adae; --ink-3: #7b8082;
      --rule: #2e3132; --rule-strong: #454849;
      --edit: #6fb3dc; --edit-soft: #16303f;
      --wire-edge: #9aa0a3;
      --hsg-hi: #4d5254; --hsg-lo: #2e3234; --hsg-edge: #656a6d;
      --cav: #141718; --cav-edge: #0b0d0e; --cav-text: #e4e8e7;
    --xt-hi: #d6a92a; --xt-lo: #9c7510; --xt-edge: #ffd968;
      --xt-hi: #d6a92a; --xt-lo: #9c7510; --xt-edge: #ffd968;
      --iec-hi: #4f5458; --iec-lo: #2c3033; --iec-edge: #8d9397; --iec-slot: #0c0e0f;
    --qd-hi: #5fae52; --qd-lo: #2f7a2d; --qd-edge: #9be08d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #131515; --panel: #1c1e1f; --panel-2: #242727;
    --ink: #e8eaea; --ink-2: #a8adae; --ink-3: #7b8082;
    --rule: #2e3132; --rule-strong: #454849;
    --edit: #6fb3dc; --edit-soft: #16303f;
    --wire-edge: #9aa0a3;
    --hsg-hi: #4d5254; --hsg-lo: #2e3234; --hsg-edge: #656a6d;
    --cav: #141718; --cav-edge: #0b0d0e; --cav-text: #e4e8e7;
    --iec-hi: #4f5458; --iec-lo: #2c3033; --iec-edge: #8d9397; --iec-slot: #0c0e0f;
    --qd-hi: #5fae52; --qd-lo: #2f7a2d; --qd-edge: #9be08d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
  }

  body {
    background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.55;
    padding-inline: 20px; padding-block: 0 64px;
  }
  .wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--ground); border-bottom: 1px solid var(--rule);
    margin-inline: -20px; padding: 10px 20px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .bar .status {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
    letter-spacing: .06em; color: var(--ink-3); margin-right: auto;
  }
  .bar .status.dirty { color: var(--edit); }
  button {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .04em;
    padding: 7px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--ink-3); }
  button:focus-visible { outline: 2px solid var(--edit); outline-offset: 2px; }
  button.primary { background: var(--edit); border-color: var(--edit); color: #fff; font-weight: 500; }
  button[disabled] { opacity: .45; cursor: default; }
  button.mini { padding: 3px 9px; font-size: 11px; }

  header { display: flex; flex-direction: column; gap: 8px; padding-top: 28px; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
  }
  h1 {
    font-family: Archivo, system-ui, sans-serif; font-weight: 700;
    font-size: clamp(24px, 4vw, 34px); letter-spacing: -.02em; line-height: 1.06;
    text-wrap: balance; margin: 0;
  }
  .pnline {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 17px;
    color: var(--ink); display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline;
  }
  .pnline .lab { color: var(--ink-3); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }

  h2 { font-family: Archivo, system-ui, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: -.01em; margin: 0 0 8px; }

  .draw-panel {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: var(--shadow); padding: 16px; overflow-x: auto;
  }
  .draw-panel svg { display: block; min-width: 820px; width: 100%; height: auto; }

  .svg-lbl { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
  .svg-lbl.dim { fill: var(--ink-2); font-size: 12px; }
  .svg-lbl.pem-mark { fill: var(--cav-text); letter-spacing: .12em; }
  .svg-badge { font-family: Archivo, system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #fff; }
  .svg-lbl.twist-lbl { fill: var(--ink); font-weight: 600; }
  .svg-lbl.shield-lbl { fill: var(--edit); }
  .svg-lbl.pcb-mark { fill: #8a8577; }
  .svg-lbl.tiny { fill: var(--ink-3); font-size: 11px; letter-spacing: .09em; }
  .svg-len { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; fill: var(--ink-2); }
  body.editing.view-edit .lenlbl { transform: translateY(-18px); }
  .svg-pin { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px; fill: var(--ink-3); }
  .svg-cav { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px; fill: var(--cav-text); }
  .svg-dimline { stroke: var(--ink-3); stroke-width: 1; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 12px; margin-top: 12px; }
  .card { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .card > .hd {
    background: var(--panel-2); padding: 6px 10px; border-bottom: 1px solid var(--rule);
    display: flex; align-items: baseline; gap: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  .card > .hd .ref { font-weight: 600; font-size: 12.5px; }
  .card > .hd .nm { color: var(--ink-2); font-size: 11.5px; }
  .card > .hd .pn { margin-left: auto; color: var(--ink-3); font-size: 11px; }
  .card .comp {
    border-top: 1px solid var(--rule); padding: 6px 10px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
  }
  .card .comp .ttl, .card .notes-blk .ttl {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px;
  }
  .card .comp div.row { display: flex; gap: 6px; }
  .card .comp .bref { color: var(--ink-3); }
  .card .notes-blk { border-top: 1px solid var(--rule); padding: 6px 10px; flex: 1; }
  .card .notes-body { font-size: 12px; color: var(--ink-2); white-space: pre-wrap; min-height: 16px; display: block; }
  .card .notes-body:empty::before { content: attr(data-ph); color: var(--ink-3); opacity: .6; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #cutlist table { min-width: 700px; }
  #bom table { min-width: 760px; }
  thead th {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 500;
    text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--rule-strong);
    background: var(--panel-2); white-space: nowrap;
  }
  tbody td { padding: 6px 11px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, td.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; width: 1%; text-align: center; }
  td.mono { font-size: 12px; white-space: nowrap; }
  td.kind { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-3); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; width: 1%; }
  td.col { white-space: nowrap; width: 1%; }
  td.desc { min-width: 180px; }
  td.act { width: 1%; }
  .act button { display: none; }
  body.editing .act button { display: inline-block; }
  .tbl-actions { display: none; margin-top: 10px; }
  body.editing .tbl-actions { display: flex; gap: 10px; }

  .swatch { display: inline-flex; align-items: center; gap: 7px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
  .swatch i { width: 19px; height: 10px; border-radius: 2px; display: block; border: 1px solid var(--wire-edge); }
  .swatch b { font-weight: 500; color: var(--ink-3); }

  .ed { display: inline-block; min-width: 14px; border-radius: 3px; }
  body.editing .ed { outline: 1px dashed var(--rule-strong); outline-offset: 2px; background: var(--edit-soft); cursor: text; }
  body.editing .ed:hover { outline-color: var(--edit); }
  .ed:focus { outline: 2px solid var(--edit); outline-offset: 2px; background: var(--edit-soft); }
  .ed:empty::before { content: "—"; color: var(--ink-3); }
  select.csel { display: none; }
  body.editing select.csel {
    display: inline-block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
    padding: 2px 5px; border-radius: 5px; border: 1px solid var(--rule-strong);
    background: var(--panel); color: var(--ink);
  }
  body.editing .swatch { display: none; }

  .bottom { display: grid; grid-template-columns: 1.55fr 1fr; gap: 12px; }
  .photo-panel {
    border: 1px solid var(--rule); border-radius: 10px; background: var(--panel);
    overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 130px;
  }
  .photo-panel img { display: block; width: 100%; height: auto; }
  .photo-empty {
    border: 1px dashed var(--rule-strong); border-radius: 8px; margin: 10px; padding: 14px;
    text-align: center; color: var(--ink-3); font-size: 12px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; line-height: 1.5;
  }
  .photo-act { margin-top: 8px; display: none; }
  body.editing .photo-act { display: block; }
  .titleblock {
    border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--panel);
    font-family: "IBM Plex Mono", ui-monospace, monospace; overflow: hidden; display: flex; flex-direction: column;
  }
  .titleblock .tb-row, .titleblock .tb-grid > div { padding: 5px 9px; }
  .titleblock .tb-row + .tb-grid, .titleblock .tb-grid + .tb-row { border-top: 1px solid var(--rule); }
  .titleblock .tb-grid { display: grid; grid-template-columns: 1.3fr 1fr .6fr 1fr .8fr; }
  .titleblock .tb-grid > div + div { border-left: 1px solid var(--rule); }
  .titleblock .tb-k { display: block; font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
  .titleblock .tb-v { display: block; font-size: 12px; }
  .titleblock .tb-v.big { font-size: 15px; color: var(--edit); font-weight: 600; }
  .titleblock .tb-v.file { font-size: 10px; color: var(--ink-2); word-break: break-all; }
  .titleblock .tb-title .tb-v.big { color: var(--ink); }

  footer { color: var(--ink-3); font-size: 11.5px; font-family: "IBM Plex Mono", ui-monospace, monospace; border-top: 1px solid var(--rule); padding-top: 10px; }

  @page { size: letter portrait; margin: 8mm; }
  @media print {
    :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
      --ground: #fff; --panel: #fff; --panel-2: #f1f1ee;
      --ink: #000; --ink-2: #333; --ink-3: #555;
      --rule: #bcbcb8; --rule-strong: #8a8a86;
      --hsg-hi: #f6f6f4; --hsg-lo: #d6d7d2; --hsg-edge: #8e908a;
      --cav: #3a3f41; --cav-edge: #23282a; --cav-text: #fff;
      --xt-hi: #f2c53d; --xt-lo: #d39f14; --xt-edge: #8a6708;
    --iec-hi: #5b6064; --iec-lo: #34383b; --iec-edge: #15181a; --iec-slot: #141719;
    --qd-hi: #7fd36f; --qd-lo: #3f9a3c; --qd-edge: #2a6b28;
      --wire-edge: #555; --shadow: none;
    }
    body { background: #fff; font-size: 8pt; line-height: 1.3; padding: 0;
           -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { max-width: none; gap: 2.4pt; }
    .bar, .tbl-actions, td.act, th.act, .card .pick, select { display: none !important; }
    header { padding-top: 0; gap: 2pt; }
    h1 { font-size: 12pt; }
    .eyebrow { font-size: 7pt; }
    .pnline { font-size: 10.5pt; gap: 2pt 14pt; }
    h2 { font-size: 9pt; margin-bottom: 1.8pt; }
    section { break-inside: avoid; }
    .draw-panel { padding: 3pt; box-shadow: none; overflow: visible; }
    .draw-panel svg { min-width: 0; width: 72%; margin: 0 auto; height: auto; }
    .cards { gap: 3pt; margin-top: 3pt; grid-template-columns: repeat(5, 1fr); }
    .card > .hd { padding: 2pt 4pt; }
    .card > .hd .ref { font-size: 7.6pt; } .card > .hd .nm { font-size: 6.6pt; } .card > .hd .pn { font-size: 6.4pt; }
    .card .comp, .card .notes-blk { padding: 1.6pt 4pt; font-size: 6.4pt; }
    .card .comp .ttl, .card .notes-blk .ttl { font-size: 6pt; }
    .card .notes-body { font-size: 6.4pt; line-height: 1.15; min-height: 0; }
    .card .notes-body:empty { display: none; }
    .card .notes-body:empty::before { content: ""; }
    .table-wrap { box-shadow: none; overflow: visible; break-inside: avoid; }
    table, #cutlist table, #bom table { min-width: 0; font-size: 6.6pt; }
    thead th { padding: 1.4pt 4pt; font-size: 6pt; }
    tbody td { padding: 0.7pt 4pt; line-height: 1.08; }
    .ed { line-height: 1.08; }
    td.mono { font-size: 6.4pt; } td.desc { white-space: normal; min-width: 0; font-size: 6.4pt; }
    .swatch { font-size: 6.4pt; gap: 3px; } .swatch i { width: 11px; height: 5px; }
    .bottom { gap: 5pt; break-inside: avoid; }
    .bottom:not(:has(img)) { grid-template-columns: 1fr; }
    .photo-panel:not(:has(img)) { display: none; }
    .photo-empty { display: none; }
    .titleblock .tb-row, .titleblock .tb-grid > div { padding: 1.1pt 4pt; }
    .titleblock .tb-v, .titleblock .tb-k { line-height: 1.15; }
    .titleblock .tb-k { font-size: 5.8pt; } .titleblock .tb-v { font-size: 7.6pt; }
    .titleblock .tb-v.big { font-size: 9pt; } .titleblock .tb-v.file { font-size: 6pt; }
    footer { padding-top: 2.5pt; font-size: 6pt; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---- app shell ---- */
  .bar button.on { background: var(--edit-soft); border-color: var(--rule-strong); }
  .hint { color: var(--ink-3); font-size: 12px; }
  .hint.block { max-width: 70ch; line-height: 1.5; margin: 0 0 12px; }
  table.list td.ttl-cell a { color: inherit; font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--rule-strong); }
  table.list td.ttl-cell a:hover { color: var(--edit); }
  table.list td.act button { display: inline-block; margin-left: 4px; }
  .card .pick { display: none; gap: 5px; padding: 6px 8px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  body.editing.view-edit .card .pick { display: flex; }
  .card .pick .p1pick select { max-width: 170px; }
  .picthumb { height: 34px; width: auto; vertical-align: middle; margin-right: 6px; border-radius: 3px; background: #fff; }
  .pichide { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: var(--ink-2); }
  td.pic { white-space: nowrap; }
  .card .pick select { font: 500 11px/1.2 var(--mono); padding: 3px 4px; border: 1px solid var(--rule-strong);
    border-radius: 4px; background: var(--panel); color: var(--ink); max-width: 150px; }
  .twists { margin-top: 14px; }
  .twists .ttl { font: 600 11px/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .twists.empty { display: none; }
  body.editing .twists.empty { display: block; }
  select.tatsel { display: none; }
  body.editing select.tatsel { display: inline-block; font: 500 11px/1.2 "IBM Plex Mono", ui-monospace, monospace; padding: 2px 3px;
    border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--panel); color: var(--ink); }
  body.editing .twists td.mono .ro { display: none; }
  select.ksel, select.epsel, select.connfield, select.lsel { display: none; }
  body.editing select.ksel, body.editing select.epsel, body.editing select.connfield, body.editing select.lsel {
    display: inline-block; font: 500 11px/1.2 var(--mono); padding: 2px 3px;
    border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--panel); color: var(--ink); }
  body.editing td.kind .ro, body.editing td.mono .ro { display: none; }
  body.editing .tbl-actions .hint { align-self: center; }

  .card .pick .p1pick { flex-basis: 100%; display: flex; align-items: center; gap: 6px; font: 600 11px/1.2 "IBM Plex Mono", ui-monospace, monospace;
    color: var(--edit); letter-spacing: .04em; }
  .card .pick .hint { flex-basis: 100%; font-size: 10.5px; }

  /* ---- drag a wire end to another pin ---- */
  .draw-panel svg text { pointer-events: none; }
  .cavhit { pointer-events: none; fill-opacity: 1; }
  body.editing.view-edit .cavhit { pointer-events: all; }
  body.editing.view-edit .cavhit[data-busy] { cursor: grab; }
  body.editing.view-edit svg.dragging .cavhit[data-busy] { cursor: grabbing; }
  body.editing.view-edit .cavhit.drop-hot { stroke: var(--edit); stroke-width: 2.4px; }
  body.editing.view-edit .draw-panel { outline: 1px dashed var(--rule-strong); outline-offset: 4px; border-radius: 10px; }
  .movehit, .leadhit { pointer-events: none; }
  body.editing.view-edit .movehit { pointer-events: all; cursor: move; }
  body.editing.view-edit .leadhit { pointer-events: stroke; cursor: pointer; }
  body.editing.view-edit .movehit:hover { fill: var(--edit-soft); fill-opacity: .35; }
  /* in edit mode only the hit areas take the pointer, so artwork drawn on top never blocks them */
  body.editing.view-edit .draw-panel svg :not(.cavhit):not(.routehit):not(.movehit):not(.leadhit) { pointer-events: none; }
  .drag-tip { display: none; }
  body.editing.view-edit .drag-tip { display: block; margin: 8px 0 0; }

  /* ---- connector spec, inline in the harness sheet ---- */
  .card .pick .spec { display: none; flex-basis: 100%; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  body.editing.view-edit .card .pick .spec { display: flex; }
  .card .pick .spec label { display: inline-flex; align-items: center; gap: 4px;
    font: 500 10.5px/1.2 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
  .card .pick .spec select { max-width: 110px; }
  .mini-ed { min-width: 22px; display: inline-block; font: 500 11px/1.3 var(--mono); color: var(--ink);
    text-transform: none; padding: 1px 3px; }
  tr.just-added td { background: var(--edit-soft); }

  /* ---- wire routing handles ---- */
  .routehit { display: none; }
  body.editing.view-edit .routehit { display: inline; cursor: grab; opacity: .55; }
  body.editing.view-edit .routehit:hover { opacity: 1; r: 9; }
  body.editing.view-edit .routehit.routed { opacity: .9; stroke: var(--edit); stroke-width: 2.2px; }

<script id="pagejs">(function () {
  var STORAGE_KEY = 'va-harness-app-v1';
  var SEED = JSON.parse(document.getElementById('appdata').textContent);
  var STORE = SEED, restored = false;
  try {
    var sv = window.localStorage.getItem(STORAGE_KEY);
    if (sv) { var p = JSON.parse(sv); if (p && p.harnesses) { STORE = p; restored = true; } }
  } catch (e) {}
  /* connectors shipped with a newer app file are added to a stored library, without touching edits */
  (function () {
    if (!restored || !STORE.connectors) return;
    var have = {}, added = 0;
    STORE.connectors.forEach(function (c) { have[c.id] = 1; });
    (SEED.connectors || []).forEach(function (c) {
      if (!have[c.id]) { STORE.connectors.push(JSON.parse(JSON.stringify(c))); added++; }
    });
    if (added) { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); } catch (e) {} }
  })();
  /* harnesses shipped with a newer app file are added once; deleting one afterwards sticks */
  var SHIPPED = ['v3106', 'v3105', 'v3087', 'v3103', 'v3107', 'v3110'];
  (function () {
    STORE.shipped = STORE.shipped || [];
    var have = {}, added = 0;
    STORE.harnesses.forEach(function (h) { have[h.id] = 1; });
    SHIPPED.forEach(function (id) {
      if (STORE.shipped.indexOf(id) >= 0) return;
      STORE.shipped.push(id);
      if (have[id] || !restored) return;
      (SEED.harnesses || []).forEach(function (h) { if (h.id === id) { STORE.harnesses.push(JSON.parse(JSON.stringify(h))); added++; } });
    });
    if (added) { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); } catch (e) {} }
  })();
  /* connector pictures shipped later: added once, only where the stored connector has none */
  var SHIPPED_PICS = ['V2267', 'GH6', 'V1815'];
  (function () {
    STORE.shippedPics = STORE.shippedPics || [];
    var changed = 0;
    SHIPPED_PICS.forEach(function (id) {
      if (STORE.shippedPics.indexOf(id) >= 0) return;
      STORE.shippedPics.push(id); changed++;
      var src = null; (SEED.connectors || []).forEach(function (c) { if (c.id === id) src = c.picture; });
      (STORE.connectors || []).forEach(function (c) { if (c.id === id && !c.picture && src) c.picture = src; });
    });
    if (changed && restored) { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); } catch (e) {} }
  })();
  /* build photos shipped later for a shipped harness: added once, only where the harness has none */
  var SHIPPED_PHOTOS = ['v3106'];
  (function () {
    STORE.shippedPhotos = STORE.shippedPhotos || [];
    var changed = 0;
    SHIPPED_PHOTOS.forEach(function (id) {
      if (STORE.shippedPhotos.indexOf(id) >= 0) return;
      STORE.shippedPhotos.push(id); changed++;
      var src = null; (SEED.harnesses || []).forEach(function (h) { if (h.id === id) src = h.photo; });
      STORE.harnesses.forEach(function (h) { if (h.id === id && !h.photo && src) h.photo = src; });
    });
    if (changed && restored) { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); } catch (e) {} }
  })();

  var app = document.getElementById('app');
  var view = 'list', curId = null, DATA = null;
  var editing = false, dirty = false;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function ed(v, scope, i, k) {
    return '<span class="ed" data-scope="' + scope + '" data-i="' + i + '" data-k="' + k + '">' + esc(v) + '</span>';
  }
  function edM(v, k) { return '<span class="ed" data-meta="' + k + '">' + esc(v) + '</span>'; }
  function hex(n) { return STORE.colors[n] || '#888'; }
  function ab(n) { return STORE.abbr[n] || ''; }
  function colorNames() { return Object.keys(STORE.colors); }
  function connById(id) {
    for (var i = 0; i < STORE.connectors.length; i++) if (STORE.connectors[i].id === id) return STORE.connectors[i];
    return null;
  }
  function harnessById(id) {
    for (var i = 0; i < STORE.harnesses.length; i++) if (STORE.harnesses[i].id === id) return STORE.harnesses[i];
    return null;
  }
  var RESOLVED = ['pinNames', 'picture', 'name', 'pn', 'pins', 'layout', 'numbering', 'order', 'type', 'termination', 'contactPn',
                  'style', 'arrange', 'polarity'];
  function resolve(h) {
    (h.nodes || []).forEach(function (n) {
      var c = connById(n.conn);
      if (!c) { n.name = n.name || '(missing connector)'; n.pins = n.pins || 2; n.layout = n.layout || 'single'; return; }
      RESOLVED.forEach(function (k) { n[k] = c[k]; });
    });
    return h;
  }
  function stripResolved(h) {
    var c = JSON.parse(JSON.stringify(h));
    (c.nodes || []).forEach(function (n) { RESOLVED.forEach(function (k) { delete n[k]; }); });
    return c;
  }
  function serialize() {
    return {
      version: 1, colors: STORE.colors, abbr: STORE.abbr,
      connectors: STORE.connectors, shipped: STORE.shipped, shippedPhotos: STORE.shippedPhotos, shippedPics: STORE.shippedPics,
      harnesses: STORE.harnesses.map(stripResolved)
    };
  }
  function uid(base) {
    var n = base, i = 2;
    while (harnessById(n)) { n = base + '-' + i; i++; }
    return n;
  }
  function endpoints() {
    var out = [{ v: '', t: '— none —' }];
    (DATA.nodes || []).forEach(function (n) {
      for (var p = 1; p <= n.pins; p++) out.push({ v: 'n:' + n.id + ':' + p, t: n.ref + ':' + p });
    });
    (DATA.splices || []).forEach(function (s) { out.push({ v: 's:' + s.id, t: s.ref }); });
    return out;
  }
  function epValue(e) {
    if (!e) return '';
    if (e.s != null) return 's:' + e.s;
    if (e.n != null) return 'n:' + e.n + ':' + e.p;
    return '';
  }
  function epParse(v) {
    if (!v) return null;
    var p = v.split(':');
    if (p[0] === 's') return { s: p[1] };
    return { n: p[1], p: parseInt(p[2], 10) };
  }

      s += '<path class="leadhit" data-lead="' + li + '" d="' + d + '" stroke="transparent" stroke-width="16" fill="none"/>';
      /* cut tick */
      s += '<path d="M ' + (x1 + dir * 2) + ' ' + (a.y - 7) + ' L ' + (x1 - dir * 6) + ' ' + (a.y + 7) +
        '" stroke="var(--ink-2)" stroke-width="1.6" fill="none"/>';
      s += '<text class="svg-lbl tiny" x="' + (x1 + dir * 7) + '" y="' + (a.y + (k % 2 ? 16 : -10)) +
        '" text-anchor="' + (dir > 0 ? 'start' : 'end') + '">' + tag + '</text>';
    });

    /* jumpers inside one connector */
    var jIdx = {}, jSeen = {};
    DATA.links.filter(function (l) { return l.kind === 'jumper'; }).forEach(function (l) {
      var k = l.from.n; jSeen[k] = (jSeen[k] == null) ? 0 : jSeen[k] + 1; jIdx[l.ref] = jSeen[k];
    });
    DATA.links.filter(function (l) { return l.kind === 'jumper'; }).forEach(function (l) {
      if (!l.from || !l.to || l.from.n == null || l.to.n == null) return;
      var a = pinPos(g, l.from.n, l.from.p), z = pinPos(g, l.to.n, l.to.p);
      if (!a || !z) return;
      var b = a.box;
      var jn = jIdx[l.ref] || 0;               /* stack jumper arcs at different depths so they stay readable */
      var channel = !a.far;
      var outSide = b.node.side === 'left' ? -1 : 1;
      var spread = 13 * jn;
      var bx = channel
        ? (b.colA + L.cavW / 2 + 8) + outSide * spread
        : (b.r + 15 + spread);
      var sx = a.x + L.cavW / 2, ex = z.x + L.cavW / 2;
      var d = 'M ' + sx + ' ' + a.y + ' C ' + bx + ' ' + a.y + ', ' + bx + ' ' + z.y + ', ' + ex + ' ' + z.y;
      s += casing(d) + core(d, hex(l.color));
      /* label outside the housing, on the side away from the incoming wires, level with the start pin */
      var outX = b.node.side === 'left' ? (b.x - 10) : (b.r + 10);
      s += '<text class="svg-lbl tiny" x="' + outX + '" y="' + (a.y + 3) +
        '" text-anchor="' + (b.node.side === 'left' ? 'end' : 'start') + '">' + esc(l.ref) + '</text>';
    });

    /* connector pictures, on the outer side clear of the pin labels */
    DATA.nodes.forEach(function (n) {
      var b = g.nodes[n.id];
      if (!n.picture || n.hidePic || !b || b.mated) return;
      var lft = n.side === 'left', chars = 0;
      for (var p = 1; p <= n.pins; p++) {
        var lk = used[n.id + ':' + p], lb = lk ? (ab(lk.color) + (lk.signal ? ' · ' + lk.signal : '')) : 'N/A';
        if (n.style === 'pem' && matedOn(n.id, p)) lb = matedOn(n.id, p).ref + ' plugged on';
        chars = Math.max(chars, lb.length);
      }
      var ext = n.style === 'ring' ? 58 : n.style === 'qdf' ? 50 : n.style === 'pcb' ? 84 : n.layout === 'dual' ? 12 : 14 + chars * 7.8;
      var pw = 120, ph = 96, edge = lft ? b.x : b.r;
      var px = lft ? edge - ext - 18 - pw : edge + ext + 18, py = (b.y + b.b) / 2 - ph / 2;
      s += '<image class="connpic" href="' + n.picture + '" x="' + px + '" y="' + py + '" width="' + pw + '" height="' + ph +
        '" preserveAspectRatio="xMidYMid meet"/>';
    });

    /* a bullet housing is re-drawn over the runs so the wires read as entering the back of the body */
    DATA.nodes.forEach(function (n) {
      if (n.style === 'xt90') s += xt90Housing(g.nodes[n.id]);
      if (n.style === 'pem') s += pemHousing(g.nodes[n.id]);
    });

    /* ---- cavities ---- */
    DATA.nodes.forEach(function (n) {
      var b = g.nodes[n.id];
      for (var p = 1; p <= n.pins; p++) {
        var pp = pinPos(g, n.id, p), link = used[n.id + ':' + p];
        var cx = pp.x - L.cavW / 2, cy = pp.y - L.cavH / 2;
        var hit = ' class="cavhit" data-node="' + esc(n.id) + '" data-pin="' + p + '"' +
                  (link ? ' data-busy="1"' : '');
        if (pp.stack && n.style === 'pem') {
          /* 6.3 mm quick-connect blade out of the back face, with a big wire-colour badge saying which line it is */
          var tb = pp.box, td = tb.dir, tx0 = tb.back - td * 2, tx1 = tb.back + td * 30;
          var bc = PEM_BADGE[p - 1] || ['var(--cav)', 'var(--cav-edge)'];
          if (!matedOn(n.id, p)) s += '<rect x="' + Math.min(tx0, tx1) + '" y="' + (pp.y - 6) + '" width="' + Math.abs(tx1 - tx0) + '" height="12" rx="2" ' +
            'fill="url(#hsgSide)" stroke="var(--hsg-edge)" stroke-width="1.3"' + (link ? '' : ' stroke-dasharray="3 2.5"') + '/>';
          if (!matedOn(n.id, p)) s += '<circle cx="' + (tb.back + td * 18) + '" cy="' + pp.y + '" r="2.4" fill="var(--hsg-edge)"/>';
          var bx0 = tb.back - td * 17;
          s += '<circle cx="' + bx0 + '" cy="' + pp.y + '" r="11" fill="' + bc[0] + '" stroke="' + bc[1] + '" stroke-width="2.4"/>';
          s += '<text class="svg-badge" x="' + bx0 + '" y="' + (pp.y + 4.5) + '" text-anchor="middle">' + pinMark(n, p) + '</text>';
          s += '<rect x="' + Math.min(tx0, tx1) + '" y="' + (pp.y - 11) + '" width="' + Math.abs(tx1 - tx0) + '" height="22" fill="transparent"' + hit + '/>';
          continue;
        }
        if (pp.stack) {
          var bb = pp.box, dd = bb.dir, mk = (p === 1) ? '+' : (p === 2 ? '\u2212' : String(p));
          /* solder barrel sticking out of the back face */
          s += '<rect x="' + (dd > 0 ? pp.x : pp.x - 30) + '" y="' + (pp.y - 9) + '" width="30" height="18" rx="4" ' +
            'fill="var(--cav)" stroke="var(--cav-edge)" stroke-width="1.2"' + (link ? '' : ' stroke-dasharray="3 2.5"') + '/>';
          s += '<text class="svg-cav pole" x="' + (pp.x + dd * 15) + '" y="' + (pp.y + 5) + '" text-anchor="middle">' + mk + '</text>';
          s += '<rect x="' + (dd > 0 ? pp.x : pp.x - 30) + '" y="' + (pp.y - 9) + '" width="30" height="18" rx="4" fill="transparent"' + hit + '/>';
          continue;
        }
        if (pp.pole) {
          var mark = (p === 1) ? '+' : (p === 2 ? '\u2212' : String(p));
          s += '<circle cx="' + pp.x + '" cy="' + pp.y + '" r="' + L.poleR + '" fill="var(--cav)" ' +
            'stroke="var(--xt-edge)" stroke-width="1.4"' + (link ? '' : ' stroke-dasharray="3 2.5"') + '/>';
          s += '<circle cx="' + pp.x + '" cy="' + pp.y + '" r="' + (L.poleR - 4.5) + '" fill="none" ' +
            'stroke="var(--cav-edge)" stroke-width="1" opacity="0.8"/>';
          s += '<text class="svg-cav pole" x="' + pp.x + '" y="' + (pp.y + 5) + '" text-anchor="middle">' + mark + '</text>';
          s += '<circle cx="' + pp.x + '" cy="' + pp.y + '" r="' + L.poleR + '" fill="transparent"' + hit + '/>';
          continue;
        }
        if (link) {
          s += '<rect x="' + cx + '" y="' + cy + '" width="' + L.cavW + '" height="' + L.cavH +
            '" rx="2.5" fill="var(--cav)" stroke="var(--cav-edge)" stroke-width="1.2"' + hit + '/>';
          s += '<text class="svg-cav" x="' + pp.x + '" y="' + (pp.y + 3) + '" text-anchor="middle">' + pinMark(n, p) + '</text>';
        } else {
          s += '<rect x="' + cx + '" y="' + cy + '" width="' + L.cavW + '" height="' + L.cavH +
            '" rx="2.5" fill="var(--hsg-lo)" stroke="var(--hsg-edge)" stroke-width="1" stroke-dasharray="3 2.5"' + hit + '/>';
          s += '<text class="svg-pin" x="' + pp.x + '" y="' + (pp.y + 3) + '" text-anchor="middle">' + pinMark(n, p) + '</text>';
        }
      }
    });

    /* single-row connectors get signal labels outside */
    DATA.nodes.filter(function (n) { return n.layout !== 'dual'; }).forEach(function (n) {
      var b = g.nodes[n.id];
      for (var p = 1; p <= n.pins; p++) {
        var pp = pinPos(g, n.id, p), link = used[n.id + ':' + p];
        var lab = link ? (ab(link.color) + (link.signal ? ' · ' + link.signal : '')) : 'N/A';
        var mq = n.style === 'pem' ? matedOn(n.id, p) : null;
        if (mq) lab = mq.ref + ' plugged on';
        if (pp.stack) {  /* side view: label on the mating side, clear of the wires */
          var sb = pp.box;
          s += '<text class="svg-lbl dim" x="' + (sb.mate - sb.dir * 10) + '" y="' + (pp.y + 4) +
            '" text-anchor="' + (sb.dir > 0 ? 'end' : 'start') + '">' + esc(lab) + '</text>';
          continue;
        }
        if (pp.pole) {   /* poles sit side by side, so the label goes under each one */
          s += '<text class="svg-lbl dim" x="' + pp.x + '" y="' + (b.b + 15) + '" text-anchor="middle">' +
            esc(lab) + '</text>';
          continue;
        }
        if (n.style === 'pcb') continue;   /* the pads carry their own names */
        if (n.style === 'ring' || n.style === 'qdf') {   /* the terminal fills the outer side, so the label sits under the barrel */
          if (b.mated) lab = n.ref + ' · ' + lab;
          s += '<text class="svg-lbl dim" data-lb="' + esc(n.id) + '" x="' + ((b.x + b.r) / 2) + '" y="' + (b.b + 12) + '" text-anchor="middle">' +
            esc(lab) + '</text>';
          /* compact name, shown instead of the heading when the heading would run into other text */
          if (!b.mated) s += '<text class="svg-lbl" data-cp="' + esc(n.id) + '" display="none" x="' + ((b.x + b.r) / 2) +
            '" y="' + (b.b + 10) + '" text-anchor="middle">' + esc(n.ref) + ' · ' + esc(n.pn) + '</text>';
          continue;
        }
        s += n.side === 'left'
          ? '<text class="svg-lbl dim" x="' + (b.x - 14) + '" y="' + (pp.y + 4) + '" text-anchor="end">' + esc(lab) + '</text>'
          : '<text class="svg-lbl dim" x="' + (b.r + 14) + '" y="' + (pp.y + 4) + '">' + esc(lab) + '</text>';
      }
    });

    /* ---- splices ---- */
    DATA.splices.forEach(function (sp) {
      var pos = g.splices[sp.id]; if (!pos) return;
      s += '<rect x="' + (pos.x - 24) + '" y="' + (pos.y - 11) + '" width="48" height="22" rx="10" ' +
        'fill="var(--panel)" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 2.5"/>';
      s += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="5" fill="' + hex(sp.color) + '" stroke="var(--wire-edge)" stroke-width="1.4"/>';
      s += '<rect class="cavhit" data-splice="' + esc(sp.id) + '" data-busy="1" x="' + (pos.x - 24) + '" y="' + (pos.y - 11) +
        '" width="48" height="22" rx="10" fill="transparent"/>';
      s += '<text class="svg-lbl" x="' + pos.x + '" y="' + (pos.y - 17) + '" text-anchor="middle">' + esc(sp.ref) + '</text>';
    });

    s += '<g id="draglayer"></g></svg>';
    return '<div class="draw-panel">' + s + '</div>';
  }


  /* ---------------- cards ---------------- */
  function notesBlock(v, scope, i) {
    return '<div class="notes-blk"><div class="ttl">Notes</div>' +
      '<div class="ed notes-body" data-scope="' + scope + '" data-i="' + i + '" data-k="notes" ' +
      'data-ph="Build note">' + esc(v || '') + '</div></div>';
  }
  function connSelect(i, cur) {
    var s = '<select class="connsel" data-i="' + i + '" aria-label="Connector">';
    STORE.connectors.forEach(function (c) {
      s += '<option value="' + esc(c.id) + '"' + (c.id === cur ? ' selected' : '') + '>' + esc(c.name) + ' · ' + esc(c.pn) + '</option>';
    });
    return s + '<option value="__new">+ New connector…</option></select>';
  }
  function newConnector(seed) {
    var c = { id: 'C' + Date.now().toString(36) + Math.floor(Math.random() * 99),

  function connIndex(id) {

  }

  function connSpec(n) {
    var ci = connIndex(n.conn); if (ci < 0) return '';

      '<label>Pos <span class="ed mini-ed" data-scope="connectors" data-i="' + ci + '" data-k="pins">' + esc(c.pins) + '</span></label>' +
      '<label>Rows ' + pick(ci, 'layout', c.layout, [['single', '1'], ['dual', '2']]) + '</label>' +
      '<label>Numbering ' + pick(ci, 'numbering', c.numbering, [['interleaved', 'odd / even'], ['column', 'down a column']]) + '</label>' +
      '</div>';
  }
  function pin1Select(i, n) {
    var cur = pin1Of(n), opts = n.layout === 'dual' ? PIN1_DUAL : PIN1_SINGLE, lbl = 'Pin 1 on this drawing';

    return s + '</select></label>';
  }
  function nodePic(i, n) {
    var ci = connIndex(n.conn); if (ci < 0) return '';

      (c.picture ? '<label class="pichide"><input type="checkbox" class="picshow" data-i="' + i + '"' + (n.hidePic ? '' : ' checked') + '> show on this drawing</label>' : '') +
      '</div>';
  }
  function mateSelect(i, n) {
    if (n.style !== 'qdf') return '';
    var cur = mateOf(n) ? n.mate.n + ':' + n.mate.p : '', any = false;

      if (m.style !== 'pem') return;

        var v = m.id + ':' + p; any = true;
        s += '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(m.ref) + ' tab ' + pinMark(m, p) + '</option>';
      }

  }
  function sideSelect(i, cur) {

  function renderCards() {
    var h = '<div class="cards">';

  /* ---------------- cut list ---------------- */
  function endLabel(e) {

    var nd = null; DATA.nodes.forEach(function (n) { if (n.id === e.n) nd = n; });

  }
  function epSelect(i, which, e) {

  }
  var KINDS = ['wire', 'jumper', 'nc', 'stub', 'drain'];
  var LEADS = [['', 'auto'], ['down', '↓ down'], ['right', '→ right'], ['up', '↑ up'], ['left', '← left']];
  function renderCutlist() {
    var h = '<div class="table-wrap" id="cutlist"><table><thead><tr>' +
      '<th>Wire</th><th>Type</th><th>From</th><th>Color</th><th>To</th><th>AWG</th><th>Length</th><th>Signal</th><th class="act"></th>' +
      '</tr></thead><tbody>';

      ksel += '</select>';

      }

        '<td class="num">' + ed(l.ref, 'links', i, 'ref') + '</td>' +
        '<td class="kind"><span class="ro">' + esc(l.kind) + '</span>' + ksel + '</td>' +
        '<td class="mono"><span class="ro">' + esc(endLabel(l.from)) + '</span>' + epSelect(i, 'from', l.from) + '</td>' +
        '<td class="col"><span class="swatch"><i style="background:' + hex(l.color) + '"></i>' +

        '<td class="mono"><span class="ro">' + esc(l.kind === 'drain' ? 'cable shield' : endLabel(l.to)) + '</span>' + epSelect(i, 'to', l.to) + '</td>' +
        '<td class="mono">' + ed(l.gauge, 'links', i, 'gauge') + '</td>' +
        '<td class="mono">' + ed(l.length, 'links', i, 'length') + '</td>' +
        '<td class="mono">' + ed(l.signal, 'links', i, 'signal') + '</td>' +
        '<td class="act"><button class="mini" data-mv="' + i + ':-1" title="Move up">↑</button>' +
        '<button class="mini" data-mv="' + i + ':1" title="Move down">↓</button>' +
        '<button class="mini" data-del="links:' + i + '">Remove</button></td></tr>';
    });
    h += '</tbody></table></div><div class="tbl-actions"><button id="btn-add-link">Add conductor</button></div>';
    h += renderTwists();
    return h;
  }
  function renderTwists() {
    var tws = DATA.twists || [];
    var h = '<div class="twists' + (tws.length ? '' : ' empty') + '"><div class="ttl">Twists and shields</div>';
    if (tws.length) {
      h += '<div class="table-wrap"><table><thead><tr><th>Type</th><th>Wires</th><th>Rate / label</th><th>Drawn</th><th class="act"></th></tr></thead><tbody>';
      tws.forEach(function (tw, i) {
        var n = twistLinks(tw).length;
        var at = '<span class="ro">' + esc((TWIST_AT.filter(function (o) { return o[0] === tw.at; })[0] || TWIST_AT[0])[1]) + '</span>' +
          '<select class="tatsel" data-i="' + i + '">';
        TWIST_AT.forEach(function (o) { at += '<option value="' + o[0] + '"' + (o[0] === (tw.at || 'start') ? ' selected' : '') + '>' + o[1] + '</option>'; });
        at += '</select>';
        var sh = tw.kind === 'shield';
        var ty = '<span class="ro">' + (sh ? 'shield' : 'twist') + '</span><select class="tatsel tksel" data-i="' + i + '">' +
          '<option value="twist"' + (sh ? '' : ' selected') + '>twist</option><option value="shield"' + (sh ? ' selected' : '') + '>shield</option></select>';
        h += '<tr><td class="mono">' + ty + '</td><td class="mono">' + ed(tw.wires, 'twists', i, 'wires') +
          (n < 2 ? ' <span class="hint">needs two or more wires from the cut list</span>' : '') + '</td>' +
          '<td class="mono">' + (sh ? ed(tw.label || 'SHLD', 'twists', i, 'label') : ed(tw.tpi, 'twists', i, 'tpi') + ' TPI') + '</td><td class="mono">' + at + '</td>' +
          '<td class="act"><button class="mini" data-del="twists:' + i + '">Remove</button></td></tr>';
      });
      h += '</tbody></table></div>';

    var rows = [], seen = {};

    });

  /* ---------------- dragging: wire ends between pins, and wire routing ---------------- */
  var dragState = null, dragInstalled = false, rafPending = false, lastTap = null;

  function epKey(e) { if (!e) return ''; return e.s != null ? 's:' + e.s : (e.n != null ? 'n:' + e.n + ':' + e.p : ''); }
  function hitKey(el) {
    if (!el) return '';
    if (el.dataset.splice) return 's:' + el.dataset.splice;
    if (el.dataset.node) return 'n:' + el.dataset.node + ':' + el.dataset.pin;
    return '';
  }
  function findEnd(key) {
    for (var i = 0; i < DATA.links.length; i++) {
      if (epKey(DATA.links[i].from) === key) return { i: i, w: 'from' };
      if (epKey(DATA.links[i].to) === key) return { i: i, w: 'to' };
    }
    return null;
  }
  function theSvg() { return app.querySelector('.draw-panel svg'); }
  function svgPt(ev) {
    var svg = theSvg(); if (!svg) return { x: 0, y: 0 };
    var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    return { x: vb.x + (ev.clientX - r.left) / r.width * vb.width, y: vb.y + (ev.clientY - r.top) / r.height * vb.height };
  }
  function targetUnder(ev) {

  function clearHot() {
    var svg = theSvg(); if (!svg) return;
    Array.prototype.forEach.call(svg.querySelectorAll('.drop-hot'), function (e) { e.classList.remove('drop-hot'); });
  }

  /* trim the sheet to what is actually drawn, so empty space never sits above the parts
     (whatever left it there: a removed connector, an old route, a stray splice) */
  /* small terminals crowded together: swap any heading that collides with other text for the compact
     "ref · P/N" line under the barrel, with the wire label dropped a line below it */
  function declutter(svg) {
    var boxOf = function (t) { try { return t.getBBox(); } catch (e) { return null; } };
    var hit = function (a, c) { return a.x < c.x + c.width && c.x < a.x + a.width && a.y < c.y + c.height && c.y < a.y + a.height; };
    Array.prototype.forEach.call(svg.querySelectorAll('text[data-cp]'), function (cp) {
      var id = cp.getAttribute('data-cp');
      var own = svg.querySelectorAll('text[data-hd="' + id + '"]');
      var others = Array.prototype.filter.call(svg.querySelectorAll('text'), function (t) {
        return t.getAttribute('display') !== 'none' && t.getAttribute('data-hd') !== id &&
          t.getAttribute('data-lb') !== id && t.getAttribute('data-cp') !== id;
      }).map(boxOf).filter(Boolean);
      var clash = Array.prototype.some.call(own, function (t) {
        var b = boxOf(t); return b && others.some(function (o) { return hit(b, o); });
      });
      if (!clash) return;
      Array.prototype.forEach.call(own, function (t) { t.setAttribute('display', 'none'); });
      cp.removeAttribute('display');
      var lb = svg.querySelector('text[data-lb="' + id + '"]');
      if (lb) lb.setAttribute('y', parseFloat(lb.getAttribute('y')) + 10);
    });
  }
  function fitSvg() {
    var svg = theSvg(); if (!svg || dragState) return;
    declutter(svg);
    var bb; try { bb = svg.getBBox(); } catch (e) { return; }
    if (!bb || !bb.width) return;
    var vb = svg.viewBox.baseVal, bottom = vb.y + vb.height;
    var y0 = Math.max(0, Math.floor(bb.y - 50));
    var x0 = Math.min(0, Math.floor(bb.x - 12)), x1 = Math.max(1060, Math.ceil(bb.x + bb.width + 12));
    if (y0 !== vb.y || x0 !== vb.x || x1 - x0 !== vb.width)
      svg.setAttribute('viewBox', x0 + ' ' + y0 + ' ' + (x1 - x0) + ' ' + (bottom - y0));
  }
  function wireDrag() {
    fitSvg();
    if (view !== 'edit' || !editing) return;
    var svg = theSvg(); if (!svg) return;

    Array.prototype.forEach.call(svg.querySelectorAll('.cavhit'), function (el) {
      el.addEventListener('pointerdown', function (ev) {
        var key = hitKey(el); if (!key) return;
        var end = findEnd(key); if (!end) return;       /* only an occupied end can be moved */
        ev.preventDefault();
        var o = svgPt(ev);
        dragState = { kind: 'end', end: end, from: key };
        svg.classList.add('dragging');
        var layer = svg.querySelector('#draglayer');
        if (layer) layer.innerHTML = '<line id="dragline" x1="' + o.x + '" y1="' + o.y + '" x2="' + o.x +
          '" y2="' + o.y + '" stroke="var(--edit)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>';
      });
    });

    Array.prototype.forEach.call(svg.querySelectorAll('.routehit'), function (el) {
      el.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        var i = parseInt(el.dataset.link, 10), now = Date.now();
        /* pointerdown suppresses the native dblclick, so detect the second tap here */
        if (lastTap && lastTap.i === i && now - lastTap.t < 400) {

          redraw(); markDirty(); setStatus('Routing cleared for that wire');
          return;
        }

      });
    });

    Array.prototype.forEach.call(svg.querySelectorAll('.leadhit'), function (el) {
      el.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        var l = DATA.links[parseInt(el.dataset.lead, 10)]; if (!l) return;
        var at = 0; LEADS.forEach(function (o, j) { if (o[0] === (l.lead || '')) at = j; });
        var nx = LEADS[(at + 1) % LEADS.length];

        rerenderAll(); markDirty(); setStatus(l.ref + ' lead: ' + nx[1] + ' — click again to swing it');
      });
    });

    Array.prototype.forEach.call(svg.querySelectorAll('.movehit'), function (el) {
      el.addEventListener('pointerdown', function (ev) {

        var g0 = geom(), pinned = [], nd = null;

        });

        svg.classList.add('dragging');

    });

        clearHot();
        var t = targetUnder(ev); if (t) t.classList.add('drop-hot');
        return;
      }

      if (dragState.kind === 'node') {
        var ds = dragState, dx = pt.x - ds.o.x, dy = pt.y - ds.o.y;
        if (!ds.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
        ds.moved = true;
        var snap = function (v) { return Math.round(v / 8) * 8; };
        ds.node.pos = { x: Math.max(40, Math.min(1020, snap(ds.x0 + dx))), y: Math.max(64, snap(ds.y0 + dy)) };
        /* past the middle of the sheet the connector turns round to face the other way */
        ds.node.side = ds.node.pos.x > 496 ? 'right' : 'left';
      } else {
        /* routing: move the waypoint and redraw on the next frame */
        var l = DATA.links[dragState.i]; if (!l) return;

        return;

      var t = targetUnder(ev); if (!t) return;
      var tk = hitKey(t); if (!tk || tk === d.from) return;
      var occupant = findEnd(tk);
      DATA.links[d.end.i][d.end.w] = epParse(tk);
      if (occupant) DATA.links[occupant.i][occupant.w] = epParse(d.from);   /* swap rather than double up */
      rerenderAll(); markDirty();

    document.addEventListener('pointercancel', function () {
      dragState = null; clearHot();
      var svg5 = theSvg(); if (svg5) { svg5.classList.remove('dragging');
        var l5 = svg5.querySelector('#draglayer'); if (l5) l5.innerHTML = ''; }
    });
  }

    if (msg) { el.textContent = msg; el.className = 'status' + (d2 ? ' dirty' : ''); return; }
    if (dirty) { el.textContent = '⚠ Not saved — storage full. Use Export JSON or Download backup'; el.className = 'status dirty'; return; }
    el.textContent = editing ? 'Editing — click any field' : ''; el.className = 'status';
  }
  /* every edit autosaves to this browser; dirty only stays set if that save fails */
  function persist() { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize())); return true; } catch (e) { return false; } }
  function markDirty() { dirty = !persist(); if (dirty) setStatus(); else setStatus('Saved'); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  function bindEditable(el) {
    el.addEventListener('input', function () {
      var txt = el.textContent.replace(/\s+/g, ' ').trim();
      var sc = el.dataset.scope, k = el.dataset.k, meta = el.dataset.meta, i = parseInt(el.dataset.i, 10);
      if (sc === 'connectors') { STORE.connectors[i][k] = (k === 'pins') ? (parseInt(txt, 10) || 1) : txt; }
      else if (sc === 'connnode') {
        var cdef = connById(DATA.nodes[i].conn);
        if (cdef) { cdef[k] = txt; DATA.nodes[i][k] = txt; redraw(); }
      }
      else if (sc === 'links') { DATA.links[i][k] = txt; redraw(); }
      else if (sc === 'nodes') { DATA.nodes[i][k] = txt; redraw(); }
      else if (sc === 'splices') { DATA.splices[i][k] = txt; redraw(); }
      else if (sc === 'bom') { DATA.bom[i][k] = txt; }
      else if (sc === 'twists') { DATA.twists[i][k] = txt; redraw(); }
      else if (sc === 'titleBlock') { DATA.titleBlock[k] = txt; }
      else if (meta) { DATA[meta] = txt; }
      markDirty();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && el.dataset.k !== 'notes') { e.preventDefault(); el.blur(); }
    });
    el.addEventListener('paste', function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, t.replace(/\s+/g, ' '));
    });
  }
  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function each(sel, fn) { Array.prototype.forEach.call(app.querySelectorAll(sel), fn); }

  function openHarness(id, startEditing) {
    curId = id; DATA = harnessById(id); resolve(DATA); view = 'edit';
    editing = !!startEditing || !(DATA.nodes && DATA.nodes.length);
    render(); window.scrollTo(0, 0);
  }
  function newHarness(from) {
    var src = from ? JSON.parse(JSON.stringify(stripResolved(harnessById(from)))) : {
      title: 'New harness', assemblyPn: 'TBD', rev: 'A', eyebrow: 'Vision Aerial · wire harness',
      nodes: [], splices: [], links: [], bom: [],
      titleBlock: { date: '', size: 'A4', sheet: '1 of 1', file: '' }, footer: ''
    };
    if (from) src.title = src.title + ' (copy)';
    src.id = uid((src.title || 'harness').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'harness');
    STORE.harnesses.push(src); markDirty(); openHarness(src.id, true);
  }


  function focusCardName(i) {
    var el = app.querySelectorAll('.card .nm .ed')[i];
    if (!el) return;
    el.scrollIntoView({ block: 'center' });
    el.focus();
    try {
      var r = document.createRange(); r.selectNodeContents(el);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    } catch (e) {}
  }
  function wireAll() {
    on('btn-save', save);
    on('btn-tab-list', function () { view = 'list'; render(); });
    on('btn-tab-conn', function () { view = 'conn'; render(); });
    on('btn-back', function () { view = 'list'; editing = false; render(); window.scrollTo(0, 0); });
    on('btn-export', exportJson);
    on('btn-import', importJson);
    on('btn-new', function () { newHarness(null); });
    on('btn-edit', function () { editing = !editing; rerenderAll(); setStatus(); });
    on('btn-csv', exportCsv);
    on('btn-straighten', function () {
      var n = 0;
      DATA.links.forEach(function (l) { if (l.route) { delete l.route; n++; } });
      rerenderAll(); markDirty();
      setStatus(n ? 'Routing cleared on ' + n + ' wire' + (n === 1 ? '' : 's') : 'Nothing was hand-routed');
    });
    on('btn-layout', function () {
      var n = 0;
      DATA.nodes.forEach(function (nd) { if (nd.pos) { delete nd.pos; n++; } });
      rerenderAll(); markDirty();
      setStatus(n ? 'Layout reset' : 'Nothing was moved');
    });
    on('btn-print', function () { if (editing) { editing = false; applyEditState(); } window.print(); });
    on('btn-add-conn', function () {
      newConnector(null); rerenderAll(); markDirty();
      var rows = app.querySelectorAll('#app tbody tr, tbody tr');
      var last = rows[rows.length - 1];
      if (last) {
        last.classList.add('just-added');
        var f = last.querySelector('.ed');
        if (f) { f.scrollIntoView({ block: 'center' }); f.focus();
          try { var r = document.createRange(); r.selectNodeContents(f);
            var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(r); } catch (e) {} }
      }
      setStatus('New connector added — fill in the name, P/N and positions');
    });

    each('[data-open]', function (b) {
      b.addEventListener('click', function (e) { e.preventDefault(); openHarness(b.dataset.open); });
    });
    each('[data-clone]', function (b) { b.addEventListener('click', function () { newHarness(b.dataset.clone); }); });
    each('[data-delh]', function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(b.dataset.delh, 10);
        if (!window.confirm('Delete "' + STORE.harnesses[i].title + '"?')) return;
        STORE.harnesses.splice(i, 1); rerenderAll(); markDirty();
      });
    });
    each('[data-delc]', function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(b.dataset.delc, 10), c = STORE.connectors[i], used = [];
        STORE.harnesses.forEach(function (hh) {
          (hh.nodes || []).forEach(function (n) { if (n.conn === c.id && used.indexOf(hh.title) < 0) used.push(hh.title); });
        });
        if (used.length) { window.alert('Still used by: ' + used.join(', ')); return; }
        STORE.connectors.splice(i, 1); rerenderAll(); markDirty();
      });
    });
    each('select.connfield', function (s) {
      s.addEventListener('change', function () {
        STORE.connectors[parseInt(s.dataset.i, 10)][s.dataset.k] = s.value; rerenderAll(); markDirty();
      });
    });
    each('select.connsel', function (s) {
      s.addEventListener('change', function () {
        var i = parseInt(s.dataset.i, 10);
        if (s.value === '__new') {
          var c = newConnector({ name: 'NEW CONNECTOR ' + (STORE.connectors.length + 1) });
          DATA.nodes[i].conn = c.id; rerenderAll(); markDirty();
          focusCardName(i); setStatus('New connector added — name it and set the positions');
          return;
        }
        DATA.nodes[i].conn = s.value; rerenderAll(); markDirty();
      });
    });
    each('select.sidesel', function (s) {
      s.addEventListener('change', function () {
        DATA.nodes[parseInt(s.dataset.i, 10)].side = s.value; rerenderAll(); markDirty();
      });
    });
    each('select.ksel', function (s) {
      s.addEventListener('change', function () {
        DATA.links[parseInt(s.dataset.i, 10)].kind = s.value; rerenderAll(); markDirty();
      });
    });
    each('[data-pic]', function (b) { b.addEventListener('click', function (e) { e.preventDefault(); choosePicture(parseInt(b.dataset.pic, 10)); }); });
    each('[data-picdel]', function (b) {
      b.addEventListener('click', function (e) {
        e.preventDefault();
        delete STORE.connectors[parseInt(b.dataset.picdel, 10)].picture;
        if (DATA) resolve(DATA);
        rerenderAll(); markDirty();
      });
    });
    each('input.picshow', function (cb) {
      cb.addEventListener('change', function () {
        var n = DATA.nodes[parseInt(cb.dataset.i, 10)];
        if (cb.checked) delete n.hidePic; else n.hidePic = true;
        rerenderAll(); markDirty();
      });
    });
    each('select.matesel', function (s) {
      s.addEventListener('change', function () {
        var n = DATA.nodes[parseInt(s.dataset.i, 10)];
        if (!s.value) { delete n.mate; rerenderAll(); markDirty(); setStatus(n.ref + ' unplugged'); return; }
        var v = s.value.split(':'), tgt = { n: v[0], p: parseInt(v[1], 10) };
        /* one terminal per tab: whatever was on it comes off */
        DATA.nodes.forEach(function (m) { if (m !== n && m.mate && m.mate.n === tgt.n && m.mate.p === tgt.p) delete m.mate; });
        n.mate = tgt; rerenderAll(); markDirty();
        setStatus(n.ref + ' plugged onto ' + s.options[s.selectedIndex].text);
      });
    });
    each('select.p1sel', function (s) {
      s.addEventListener('change', function () {
        var n = DATA.nodes[parseInt(s.dataset.i, 10)];
        n.pin1 = s.value; rerenderAll(); markDirty();
        setStatus(n.ref + (n.style === 'iec' ? ' contacts now ' : ' pin 1 now ') + s.options[s.selectedIndex].text + ' — check the drawing against the part');
      });
    });
    each('select.lsel', function (s) {
      s.addEventListener('change', function () {
        var l = DATA.links[parseInt(s.dataset.i, 10)];
        if (s.value) l.lead = s.value; else delete l.lead;
        rerenderAll(); markDirty();
      });
    });
    each('select.epsel', function (s) {
      s.addEventListener('change', function () {
        DATA.links[parseInt(s.dataset.i, 10)][s.dataset.w] = epParse(s.value); rerenderAll(); markDirty();
      });
    });
    each('.ed', bindEditable);
    each('select.csel', function (sel) {
      sel.addEventListener('change', function () {
        DATA.links[parseInt(sel.dataset.csel, 10)].color = sel.value; rerenderAll(); markDirty();
      });
    });
    each('[data-mv]', function (btn) {
      btn.addEventListener('click', function () {
        var p = btn.dataset.mv.split(':'), i = parseInt(p[0], 10), j = i + parseInt(p[1], 10);
        if (j < 0 || j >= DATA.links.length) return;
        var t = DATA.links[i]; DATA.links[i] = DATA.links[j]; DATA.links[j] = t;
        rerenderAll(); markDirty();
      });
    });
    each('[data-del]', function (btn) {
      btn.addEventListener('click', function () {
        var p = btn.dataset.del.split(':');
        DATA[p[0]].splice(parseInt(p[1], 10), 1); rerenderAll(); markDirty();
      });
    });
    on('btn-add-node', function () {
      var c = STORE.connectors[0] || newConnector(null), n = DATA.nodes.length + 1;
      DATA.nodes.push({ id: 'J' + n, ref: 'J' + n, conn: c.id, side: DATA.nodes.length ? 'right' : 'left', components: [], notes: '' });
      rerenderAll(); markDirty();
    });
    on('btn-add-splice', function () {
      var n = DATA.splices.length + 1;
      DATA.splices.push({ id: 'S' + n, ref: 'S' + n, name: 'solder splice', color: colorNames()[0], notes: '' });
      rerenderAll(); markDirty();
    });
    on('btn-add-link', function () {
      DATA.links.push({ ref: 'W' + (DATA.links.length + 1), kind: 'wire', from: null, to: null,
        color: colorNames()[0], gauge: '28 AWG', length: '', signal: '' });
      rerenderAll(); markDirty();
    });
    on('btn-add-twist', function () {
      (DATA.twists = DATA.twists || []).push({ wires: 'W1, W2', tpi: '4', at: 'start' });
      rerenderAll(); markDirty();
    });
    each('select.tatsel', function (sl) {
      sl.addEventListener('change', function () {
        var tw = DATA.twists[parseInt(sl.dataset.i, 10)];
        if (sl.classList.contains('tksel')) { if (sl.value === 'shield') tw.kind = 'shield'; else delete tw.kind; }
        else tw.at = sl.value;
        rerenderAll(); markDirty();
      });
    });
    on('btn-bom-take', function () { DATA.bom = autoBom(); rerenderAll(); markDirty(); });
    on('btn-bom-auto', function () { DATA.bom = []; rerenderAll(); markDirty(); });
    on('btn-add-bom', function () { DATA.bom.push({ qty: '', meas: '', item: '', desig: '', desc: '' }); rerenderAll(); markDirty(); });
    on('btn-photo', attachPhoto);
    on('btn-photo-clear', function () { DATA.photo = ''; rerenderAll(); markDirty(); });
  }
  function applyEditState() {
    document.body.classList.toggle('editing', editing || view !== 'edit');
    each('.ed', function (el) { el.contentEditable = (editing || view !== 'edit') ? 'true' : 'false'; });
    var e = document.getElementById('btn-edit'); if (e) e.textContent = editing ? 'Done' : 'Edit';
  }
  function attachPhoto() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var img = new Image();
        img.onload = function () {
          var mx = 1500, sc = Math.min(1, mx / img.width);
          var cv = document.createElement('canvas');
          cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          DATA.photo = cv.toDataURL('image/jpeg', 0.72);
          rerenderAll(); markDirty();
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(f);
    });
    inp.click();
  }

  function buildDoc() {
    var css = document.getElementById('pagecss').textContent;
    var js = document.getElementById('pagejs').textContent;
    var json = JSON.stringify(serialize(), null, 1).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>Vision Aerial harness library</title>\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">\n' +
      '<style id="pagecss">' + css + '</style>\n</head>\n<body>\n' +
      '<script id="appdata" type="application/json">\n' + json + '\n<\/script>\n' +
      '<div id="app"></div>\n<script id="pagejs">' + js + '<\/script>\n</body>\n</html>\n';
  }
  function download(fn, text, mime) {
    var blob = new Blob([text], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = fn;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function save() {
    download('va-harness-library.html', buildDoc(), 'text/html');
    setStatus('Backup downloaded');
  }
  function exportJson() { download('va-harness-data.json', JSON.stringify(serialize(), null, 1), 'application/json'); setStatus('Data exported'); }
  function importJson() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          if (!d || !d.harnesses) throw 0;
          if (!window.confirm('Replace the current library with ' + d.harnesses.length + ' harnesses from this file?')) return;
          STORE = d; STORE.colors = STORE.colors || SEED.colors; STORE.abbr = STORE.abbr || SEED.abbr;
          view = 'list'; DATA = null; rerenderAll(); markDirty(); setStatus('Imported');
        } catch (e) { window.alert('That file is not a harness library export.'); }
      };
      rd.readAsText(f);
    });
    inp.click();
  }
  function csvCell(s2) { s2 = String(s2 == null ? '' : s2); return /[",\n]/.test(s2) ? '"' + s2.replace(/"/g, '""') + '"' : s2; }
  function exportCsv() {
    var rows = [['CUT LIST — ' + DATA.title], ['Wire', 'Type', 'From', 'Color', 'Abbr', 'To', 'AWG', 'Length', 'Signal']];
    DATA.links.forEach(function (l) {
      rows.push([l.ref, l.kind, endLabel(l.from), l.color, ab(l.color), endLabel(l.to), l.gauge, l.length, l.signal]);
    });
    if (DATA.twists && DATA.twists.length) {
      rows.push([]); rows.push(['TWISTS AND SHIELDS']); rows.push(['Type', 'Wires', 'TPI / label']);
      DATA.twists.forEach(function (tw) { rows.push([tw.kind === 'shield' ? 'shield' : 'twist', tw.wires, tw.kind === 'shield' ? (tw.label || 'SHLD') : tw.tpi]); });
    }
    rows.push([]); rows.push(['BILL OF MATERIALS']);
    rows.push(['Id'].concat(BOM_COLS.map(function (c) { return c[1]; })));
    (DATA.bom && DATA.bom.length ? DATA.bom : autoBom()).forEach(function (r, i) {
      rows.push([i + 1].concat(BOM_COLS.map(function (c) { return r[c[0]]; })));
    });
    download((DATA.assemblyPn || 'harness') + '-cutlist-bom.csv', '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'), 'text/csv');
    setStatus('CSV exported');
  }
  window.addEventListener('beforeunload', function (e) { if (!dirty) return; e.preventDefault(); e.returnValue = ''; });

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
