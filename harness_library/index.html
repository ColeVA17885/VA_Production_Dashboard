<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Aerial harness library</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="application-name" content="Harness Library">
<meta name="theme-color" content="#1a1e20">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<style id="pagecss">
  * { box-sizing: border-box; }
  body { margin: 0; }
  img, svg { max-width: 100%; }
  [hidden] { display: none !important; }

  :root {
    --ground: #f2f2ef; --panel: #ffffff; --panel-2: #e9e9e4;
    --ink: #17191a; --ink-2: #4c5052; --ink-3: #7a7f81;
    --rule: #d4d5d0; --rule-strong: #b4b6b0;
    --edit: #1f5f8b; --edit-soft: #dbeaf4;
    --wire-edge: #6c7073;
    --hsg-hi: #f4f4f2; --hsg-lo: #c8cac4; --hsg-edge: #94968f;
    --cav: #3a3f41; --cav-edge: #23282a; --cav-text: #f0f2f1;
    --xt-hi: #f2c53d; --xt-lo: #d39f14; --xt-edge: #8a6708;
    --shadow: 0 1px 2px rgba(20,22,24,.05), 0 10px 26px rgba(20,22,24,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131515; --panel: #1c1e1f; --panel-2: #242727;
      --ink: #e8eaea; --ink-2: #a8adae; --ink-3: #7b8082;
      --rule: #2e3132; --rule-strong: #454849;
      --edit: #6fb3dc; --edit-soft: #16303f;
      --wire-edge: #9aa0a3;
      --hsg-hi: #4d5254; --hsg-lo: #2e3234; --hsg-edge: #656a6d;
      --cav: #141718; --cav-edge: #0b0d0e; --cav-text: #e4e8e7;
    --xt-hi: #d6a92a; --xt-lo: #9c7510; --xt-edge: #ffd968;
      --xt-hi: #d6a92a; --xt-lo: #9c7510; --xt-edge: #ffd968;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #131515; --panel: #1c1e1f; --panel-2: #242727;
    --ink: #e8eaea; --ink-2: #a8adae; --ink-3: #7b8082;
    --rule: #2e3132; --rule-strong: #454849;
    --edit: #6fb3dc; --edit-soft: #16303f;
    --wire-edge: #9aa0a3;
    --hsg-hi: #4d5254; --hsg-lo: #2e3234; --hsg-edge: #656a6d;
    --cav: #141718; --cav-edge: #0b0d0e; --cav-text: #e4e8e7;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
  }

  body {
    background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.55;
    padding-inline: 20px; padding-block: 0 64px;
  }
  .wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--ground); border-bottom: 1px solid var(--rule);
    margin-inline: -20px; padding: 10px 20px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .bar .status {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
    letter-spacing: .06em; color: var(--ink-3); margin-right: auto;
  }
  .bar .status.dirty { color: var(--edit); }
  button {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .04em;
    padding: 7px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--ink-3); }
  button:focus-visible { outline: 2px solid var(--edit); outline-offset: 2px; }
  button.primary { background: var(--edit); border-color: var(--edit); color: #fff; font-weight: 500; }
  button[disabled] { opacity: .45; cursor: default; }
  button.mini { padding: 3px 9px; font-size: 11px; }

  header { display: flex; flex-direction: column; gap: 8px; padding-top: 28px; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
  }
  h1 {
    font-family: Archivo, system-ui, sans-serif; font-weight: 700;
    font-size: clamp(24px, 4vw, 34px); letter-spacing: -.02em; line-height: 1.06;
    text-wrap: balance; margin: 0;
  }
  .pnline {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 17px;
    color: var(--ink); display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline;
  }
  .pnline .lab { color: var(--ink-3); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }

  h2 { font-family: Archivo, system-ui, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: -.01em; margin: 0 0 8px; }

  .draw-panel {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: var(--shadow); padding: 16px; overflow-x: auto;
  }
  .draw-panel svg { display: block; min-width: 820px; width: 100%; height: auto; }

  .svg-lbl { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
  .svg-lbl.dim { fill: var(--ink-2); font-size: 12px; }
  .svg-lbl.tiny { fill: var(--ink-3); font-size: 11px; letter-spacing: .09em; }
  .svg-pin { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px; fill: var(--ink-3); }
  .svg-cav { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px; fill: var(--cav-text); }
  .svg-dimline { stroke: var(--ink-3); stroke-width: 1; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 12px; margin-top: 12px; }
  .card { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .card > .hd {
    background: var(--panel-2); padding: 6px 10px; border-bottom: 1px solid var(--rule);
    display: flex; align-items: baseline; gap: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  .card > .hd .ref { font-weight: 600; font-size: 12.5px; }
  .card > .hd .nm { color: var(--ink-2); font-size: 11.5px; }
  .card > .hd .pn { margin-left: auto; color: var(--ink-3); font-size: 11px; }
  .card .comp {
    border-top: 1px solid var(--rule); padding: 6px 10px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
  }
  .card .comp .ttl, .card .notes-blk .ttl {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px;
  }
  .card .comp div.row { display: flex; gap: 6px; }
  .card .comp .bref { color: var(--ink-3); }
  .card .notes-blk { border-top: 1px solid var(--rule); padding: 6px 10px; flex: 1; }
  .card .notes-body { font-size: 12px; color: var(--ink-2); white-space: pre-wrap; min-height: 16px; display: block; }
  .card .notes-body:empty::before { content: attr(data-ph); color: var(--ink-3); opacity: .6; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #cutlist table { min-width: 700px; }
  #bom table { min-width: 760px; }
  thead th {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 500;
    text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--rule-strong);
    background: var(--panel-2); white-space: nowrap;
  }
  tbody td { padding: 6px 11px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, td.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; width: 1%; text-align: center; }
  td.mono { font-size: 12px; white-space: nowrap; }
  td.kind { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-3); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; width: 1%; }
  td.col { white-space: nowrap; width: 1%; }
  td.desc { min-width: 180px; }
  td.act { width: 1%; }
  .act button { display: none; }
  body.editing .act button { display: inline-block; }
  .tbl-actions { display: none; margin-top: 10px; }
  body.editing .tbl-actions { display: flex; gap: 10px; }

  .swatch { display: inline-flex; align-items: center; gap: 7px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
  .swatch i { width: 19px; height: 10px; border-radius: 2px; display: block; border: 1px solid var(--wire-edge); }
  .swatch b { font-weight: 500; color: var(--ink-3); }

  .ed { display: inline-block; min-width: 14px; border-radius: 3px; }
  body.editing .ed { outline: 1px dashed var(--rule-strong); outline-offset: 2px; background: var(--edit-soft); cursor: text; }
  body.editing .ed:hover { outline-color: var(--edit); }
  .ed:focus { outline: 2px solid var(--edit); outline-offset: 2px; background: var(--edit-soft); }
  .ed:empty::before { content: "—"; color: var(--ink-3); }
  select.csel { display: none; }
  body.editing select.csel {
    display: inline-block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
    padding: 2px 5px; border-radius: 5px; border: 1px solid var(--rule-strong);
    background: var(--panel); color: var(--ink);
  }
  body.editing .swatch { display: none; }

  .bottom { display: grid; grid-template-columns: 1.55fr 1fr; gap: 12px; }
  .photo-panel {
    border: 1px solid var(--rule); border-radius: 10px; background: var(--panel);
    overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 130px;
  }
  .photo-panel img { display: block; width: 100%; height: auto; }
  .photo-empty {
    border: 1px dashed var(--rule-strong); border-radius: 8px; margin: 10px; padding: 14px;
    text-align: center; color: var(--ink-3); font-size: 12px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; line-height: 1.5;
  }
  .photo-act { margin-top: 8px; display: none; }
  body.editing .photo-act { display: block; }
  .titleblock {
    border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--panel);
    font-family: "IBM Plex Mono", ui-monospace, monospace; overflow: hidden; display: flex; flex-direction: column;
  }
  .titleblock .tb-row, .titleblock .tb-grid > div { padding: 5px 9px; }
  .titleblock .tb-row + .tb-grid, .titleblock .tb-grid + .tb-row { border-top: 1px solid var(--rule); }
  .titleblock .tb-grid { display: grid; grid-template-columns: 1.3fr 1fr .6fr 1fr .8fr; }
  .titleblock .tb-grid > div + div { border-left: 1px solid var(--rule); }
  .titleblock .tb-k { display: block; font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
  .titleblock .tb-v { display: block; font-size: 12px; }
  .titleblock .tb-v.big { font-size: 15px; color: var(--edit); font-weight: 600; }
  .titleblock .tb-v.file { font-size: 10px; color: var(--ink-2); word-break: break-all; }
  .titleblock .tb-title .tb-v.big { color: var(--ink); }

  footer { color: var(--ink-3); font-size: 11.5px; font-family: "IBM Plex Mono", ui-monospace, monospace; border-top: 1px solid var(--rule); padding-top: 10px; }

  @page { size: letter portrait; margin: 8mm; }
  @media print {
    :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
      --ground: #fff; --panel: #fff; --panel-2: #f1f1ee;
      --ink: #000; --ink-2: #333; --ink-3: #555;
      --rule: #bcbcb8; --rule-strong: #8a8a86;
      --hsg-hi: #f6f6f4; --hsg-lo: #d6d7d2; --hsg-edge: #8e908a;
      --cav: #3a3f41; --cav-edge: #23282a; --cav-text: #fff;
      --xt-hi: #f2c53d; --xt-lo: #d39f14; --xt-edge: #8a6708;
      --wire-edge: #555; --shadow: none;
    }
    body { background: #fff; font-size: 8pt; line-height: 1.3; padding: 0;
           -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { max-width: none; gap: 2.4pt; }
    .bar, .tbl-actions, td.act, th.act, .card .pick, select { display: none !important; }
    header { padding-top: 0; gap: 2pt; }
    h1 { font-size: 12pt; }
    .eyebrow { font-size: 7pt; }
    .pnline { font-size: 10.5pt; gap: 2pt 14pt; }
    h2 { font-size: 9pt; margin-bottom: 1.8pt; }
    section { break-inside: avoid; }
    .draw-panel { padding: 3pt; box-shadow: none; overflow: visible; }
    .draw-panel svg { min-width: 0; width: 72%; margin: 0 auto; height: auto; }
    .cards { gap: 3pt; margin-top: 3pt; grid-template-columns: repeat(5, 1fr); }
    .card > .hd { padding: 2pt 4pt; }
    .card > .hd .ref { font-size: 7.6pt; } .card > .hd .nm { font-size: 6.6pt; } .card > .hd .pn { font-size: 6.4pt; }
    .card .comp, .card .notes-blk { padding: 1.6pt 4pt; font-size: 6.4pt; }
    .card .comp .ttl, .card .notes-blk .ttl { font-size: 6pt; }
    .card .notes-body { font-size: 6.4pt; line-height: 1.15; min-height: 0; }
    .card .notes-body:empty { display: none; }
    .card .notes-body:empty::before { content: ""; }
    .table-wrap { box-shadow: none; overflow: visible; break-inside: avoid; }
    table, #cutlist table, #bom table { min-width: 0; font-size: 6.6pt; }
    thead th { padding: 1.4pt 4pt; font-size: 6pt; }
    tbody td { padding: 0.7pt 4pt; line-height: 1.08; }
    .ed { line-height: 1.08; }
    td.mono { font-size: 6.4pt; } td.desc { white-space: normal; min-width: 0; font-size: 6.4pt; }
    .swatch { font-size: 6.4pt; gap: 3px; } .swatch i { width: 11px; height: 5px; }
    .bottom { gap: 5pt; break-inside: avoid; }
    .bottom:not(:has(img)) { grid-template-columns: 1fr; }
    .photo-panel:not(:has(img)) { display: none; }
    .photo-empty { display: none; }
    .titleblock .tb-row, .titleblock .tb-grid > div { padding: 1.1pt 4pt; }
    .titleblock .tb-v, .titleblock .tb-k { line-height: 1.15; }
    .titleblock .tb-k { font-size: 5.8pt; } .titleblock .tb-v { font-size: 7.6pt; }
    .titleblock .tb-v.big { font-size: 9pt; } .titleblock .tb-v.file { font-size: 6pt; }
    footer { padding-top: 2.5pt; font-size: 6pt; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---- app shell ---- */
  .bar button.on { background: var(--edit-soft); border-color: var(--rule-strong); }
  .hint { color: var(--ink-3); font-size: 12px; }
  .hint.block { max-width: 70ch; line-height: 1.5; margin: 0 0 12px; }
  table.list td.ttl-cell a { color: inherit; font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--rule-strong); }
  table.list td.ttl-cell a:hover { color: var(--edit); }
  table.list td.act button { display: inline-block; margin-left: 4px; }
  .card .pick { display: none; gap: 5px; padding: 6px 8px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  body.editing.view-edit .card .pick { display: flex; }
  .card .pick select { font: 500 11px/1.2 var(--mono); padding: 3px 4px; border: 1px solid var(--rule-strong);
    border-radius: 4px; background: var(--panel); color: var(--ink); max-width: 150px; }
  select.ksel, select.epsel, select.connfield { display: none; }
  body.editing select.ksel, body.editing select.epsel, body.editing select.connfield {
    display: inline-block; font: 500 11px/1.2 var(--mono); padding: 2px 3px;
    border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--panel); color: var(--ink); }
  body.editing td.kind .ro, body.editing td.mono .ro { display: none; }
  body.editing .tbl-actions .hint { align-self: center; }

  .card .pick .hint { flex-basis: 100%; font-size: 10.5px; }

  /* ---- drag a wire end to another pin ---- */
  .draw-panel svg text { pointer-events: none; }
  .cavhit { pointer-events: none; fill-opacity: 1; }
  body.editing.view-edit .cavhit { pointer-events: all; }
  body.editing.view-edit .cavhit[data-busy] { cursor: grab; }
  body.editing.view-edit svg.dragging .cavhit[data-busy] { cursor: grabbing; }
  body.editing.view-edit .cavhit.drop-hot { stroke: var(--edit); stroke-width: 2.4px; }
  body.editing.view-edit .draw-panel { outline: 1px dashed var(--rule-strong); outline-offset: 4px; border-radius: 10px; }
  .drag-tip { display: none; }
  body.editing.view-edit .drag-tip { display: block; margin: 8px 0 0; }

  /* ---- connector spec, inline in the harness sheet ---- */
  .card .pick .spec { display: none; flex-basis: 100%; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  body.editing.view-edit .card .pick .spec { display: flex; }
  .card .pick .spec label { display: inline-flex; align-items: center; gap: 4px;
    font: 500 10.5px/1.2 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
  .card .pick .spec select { max-width: 110px; }
  .mini-ed { min-width: 22px; display: inline-block; font: 500 11px/1.3 var(--mono); color: var(--ink);
    text-transform: none; padding: 1px 3px; }
  tr.just-added td { background: var(--edit-soft); }

  /* ---- wire routing handles ---- */
  .routehit { display: none; }
  body.editing.view-edit .routehit { display: inline; cursor: grab; opacity: .55; }
  body.editing.view-edit .routehit:hover { opacity: 1; r: 9; }
  body.editing.view-edit .routehit.routed { opacity: .9; stroke: var(--edit); stroke-width: 2.2px; }
  body.editing.view-edit svg.dragging .routehit { cursor: grabbing; }
  body.editing.view-edit svg.dragging { user-select: none; }

  .svg-cav.pole { font-size: 13px; font-weight: 600; }
  .xt-mark { fill: var(--xt-edge); letter-spacing: .08em; font-size: 8px; }
  .xt-emboss { fill: var(--xt-edge); font-size: 15px; font-weight: 700; letter-spacing: .1em; opacity: .85; }
  .xt-chamfer { fill: var(--xt-edge); font-size: 7px; letter-spacing: .12em; opacity: .9; }
  .card .hd button.mini { display: none; }
  body.editing.view-edit .card .hd button.mini { display: inline-block; }
</style>
</head>

      var ex = tail[0][0], ey = tail[0][1];
      var r = l.route;
      if (r && r.x != null) {
        /* hand-routed: ease through the waypoint the user dragged */
        var k1 = (r.x - ax) * 0.5, k2 = (ex - r.x) * 0.5;
        d += ' C ' + (ax + k1) + ' ' + ay + ', ' + (r.x - k1) + ' ' + r.y + ', ' + r.x + ' ' + r.y;
        d += ' C ' + (r.x + k2) + ' ' + r.y + ', ' + (ex - k2) + ' ' + ey + ', ' + ex + ' ' + ey;
      } else {
        var mid1 = ax + (ex - ax) * 0.45, mid2 = ax + (ex - ax) * 0.55;
        d += ' C ' + mid1 + ' ' + ay + ', ' + mid2 + ' ' + ey + ', ' + ex + ' ' + ey;
      }
      for (var t = 1; t < tail.length; t++) d += ' L ' + tail[t][0] + ' ' + tail[t][1];
      s += casing(d) + core(d, hex(l.color));
      handles.push({ i: li, x: (r && r.x != null) ? r.x : (ax + ex) / 2,
                     y: (r && r.x != null) ? r.y : (ay + ey) / 2, c: hex(l.color), routed: !!(r && r.x != null) });
    });

    /* route handles — one per wire, draggable in edit mode */
    handles.forEach(function (h) {
      s += '<circle class="routehit' + (h.routed ? ' routed' : '') + '" data-link="' + h.i + '" cx="' + h.x +
        '" cy="' + h.y + '" r="7" fill="' + h.c + '" stroke="var(--wire-edge)" stroke-width="1.6"/>';
    });

    /* single-ended leads: an nc conductor or a preassembled stub, terminated at one end only */
    var leadN = {};
    DATA.links.filter(function (l) {
      if (l.kind !== 'nc' && l.kind !== 'stub') return false;
      var ha = l.from && (l.from.n != null || l.from.s != null), hb = l.to && (l.to.n != null || l.to.s != null);
      return (ha ? 1 : 0) + (hb ? 1 : 0) === 1;
    }).forEach(function (l) {
      var e = (l.from && (l.from.n != null || l.from.s != null)) ? l.from : l.to;
      var a = endPoint(e, true); if (!a || a.splice) return;
      var key = e.n; leadN[key] = (leadN[key] == null) ? 0 : leadN[key] + 1;
      var k = leadN[key], dir = a.leftSide ? 1 : -1;
      var x0 = a.x + dir * (L.cavW / 2), x1 = a.x + dir * (L.cavW / 2 + 46 + 26 * k);
      var d = 'M ' + x0 + ' ' + a.y + ' L ' + x1 + ' ' + a.y;
      s += casing(d) + core(d, hex(l.color));
      /* cut tick */
      s += '<path d="M ' + (x1 + dir * 2) + ' ' + (a.y - 7) + ' L ' + (x1 - dir * 6) + ' ' + (a.y + 7) +
        '" stroke="var(--ink-2)" stroke-width="1.6" fill="none"/>';
      s += '<text class="svg-lbl tiny" x="' + (x1 + dir * 7) + '" y="' + (a.y + (k % 2 ? 16 : -10)) +
        '" text-anchor="' + (a.leftSide ? 'start' : 'end') + '">' + esc(l.ref) + ' ' +
        esc(l.kind === 'nc' ? 'NC' : 'trim') + '</text>';
    });

    /* jumpers inside one connector */
    var jIdx = {}, jSeen = {};
    DATA.links.filter(function (l) { return l.kind === 'jumper'; }).forEach(function (l) {
      var k = l.from.n; jSeen[k] = (jSeen[k] == null) ? 0 : jSeen[k] + 1; jIdx[l.ref] = jSeen[k];
    });
    DATA.links.filter(function (l) { return l.kind === 'jumper'; }).forEach(function (l) {
      if (!l.from || !l.to || l.from.n == null || l.to.n == null) return;
      var a = pinPos(g, l.from.n, l.from.p), z = pinPos(g, l.to.n, l.to.p);
      if (!a || !z) return;
      var b = a.box;
      var jn = jIdx[l.ref] || 0;               /* stack jumper arcs at different depths so they stay readable */
      var channel = !a.far;
      var outSide = b.node.side === 'left' ? -1 : 1;
      var spread = 13 * jn;
      var bx = channel
        ? (b.colA + L.cavW / 2 + 8) + outSide * spread
        : (b.r + 15 + spread);
      var sx = a.x + L.cavW / 2, ex = z.x + L.cavW / 2;
      var d = 'M ' + sx + ' ' + a.y + ' C ' + bx + ' ' + a.y + ', ' + bx + ' ' + z.y + ', ' + ex + ' ' + z.y;
      s += casing(d) + core(d, hex(l.color));
      /* label outside the housing, on the side away from the incoming wires, level with the start pin */
      var outX = b.node.side === 'left' ? (b.x - 10) : (b.r + 10);
      s += '<text class="svg-lbl tiny" x="' + outX + '" y="' + (a.y + 3) +
        '" text-anchor="' + (b.node.side === 'left' ? 'end' : 'start') + '">' + esc(l.ref) + '</text>';
    });

    /* a bullet housing is re-drawn over the runs so the wires read as entering the back of the body */
    DATA.nodes.forEach(function (n) {
      if (n.style === 'xt90') s += xt90Housing(g.nodes[n.id]);
    });

    /* ---- cavities ---- */
    DATA.nodes.forEach(function (n) {
      var b = g.nodes[n.id];
      for (var p = 1; p <= n.pins; p++) {
        var pp = pinPos(g, n.id, p), link = used[n.id + ':' + p];
        var cx = pp.x - L.cavW / 2, cy = pp.y - L.cavH / 2;
        var hit = ' class="cavhit" data-node="' + esc(n.id) + '" data-pin="' + p + '"' +
                  (link ? ' data-busy="1"' : '');
        if (pp.stack) {
          var bb = pp.box, dd = bb.dir, mk = (p === 1) ? '+' : (p === 2 ? '\u2212' : String(p));
          /* solder barrel sticking out of the back face */
          s += '<rect x="' + (dd > 0 ? pp.x : pp.x - 30) + '" y="' + (pp.y - 9) + '" width="30" height="18" rx="4" ' +
            'fill="var(--cav)" stroke="var(--cav-edge)" stroke-width="1.2"' + (link ? '' : ' stroke-dasharray="3 2.5"') + '/>';
          s += '<text class="svg-cav pole" x="' + (pp.x + dd * 15) + '" y="' + (pp.y + 5) + '" text-anchor="middle">' + mk + '</text>';
          s += '<rect x="' + (dd > 0 ? pp.x : pp.x - 30) + '" y="' + (pp.y - 9) + '" width="30" height="18" rx="4" fill="transparent"' + hit + '/>';
          continue;
        }
        if (pp.pole) {
          var mark = (p === 1) ? '+' : (p === 2 ? '\u2212' : String(p));
          s += '<circle cx="' + pp.x + '" cy="' + pp.y + '" r="' + L.poleR + '" fill="var(--cav)" ' +
            'stroke="var(--xt-edge)" stroke-width="1.4"' + (link ? '' : ' stroke-dasharray="3 2.5"') + '/>';
          s += '<circle cx="' + pp.x + '" cy="' + pp.y + '" r="' + (L.poleR - 4.5) + '" fill="none" ' +
            'stroke="var(--cav-edge)" stroke-width="1" opacity="0.8"/>';
          s += '<text class="svg-cav pole" x="' + pp.x + '" y="' + (pp.y + 5) + '" text-anchor="middle">' + mark + '</text>';
          s += '<circle cx="' + pp.x + '" cy="' + pp.y + '" r="' + L.poleR + '" fill="transparent"' + hit + '/>';
          continue;
        }
        if (link) {
          s += '<rect x="' + cx + '" y="' + cy + '" width="' + L.cavW + '" height="' + L.cavH +
            '" rx="2.5" fill="var(--cav)" stroke="var(--cav-edge)" stroke-width="1.2"' + hit + '/>';
          s += '<text class="svg-cav" x="' + pp.x + '" y="' + (pp.y + 3) + '" text-anchor="middle">' + p + '</text>';
        } else {
          s += '<rect x="' + cx + '" y="' + cy + '" width="' + L.cavW + '" height="' + L.cavH +
            '" rx="2.5" fill="var(--hsg-lo)" stroke="var(--hsg-edge)" stroke-width="1" stroke-dasharray="3 2.5"' + hit + '/>';
          s += '<text class="svg-pin" x="' + pp.x + '" y="' + (pp.y + 3) + '" text-anchor="middle">' + p + '</text>';
        }
      }
    });

    /* single-row connectors get signal labels outside */
    DATA.nodes.filter(function (n) { return n.layout !== 'dual'; }).forEach(function (n) {
      var b = g.nodes[n.id];
      for (var p = 1; p <= n.pins; p++) {
        var pp = pinPos(g, n.id, p), link = used[n.id + ':' + p];
        var lab = link ? (ab(link.color) + ' · ' + (link.signal || '')) : 'N/A';
        if (pp.stack) {  /* side view: label on the mating side, clear of the wires */
          var sb = pp.box;
          s += '<text class="svg-lbl dim" x="' + (sb.mate - sb.dir * 10) + '" y="' + (pp.y + 4) +
            '" text-anchor="' + (sb.dir > 0 ? 'end' : 'start') + '">' + esc(lab) + '</text>';
          continue;
        }
        if (pp.pole) {   /* poles sit side by side, so the label goes under each one */
          s += '<text class="svg-lbl dim" x="' + pp.x + '" y="' + (b.b + 15) + '" text-anchor="middle">' +
            esc(lab) + '</text>';
          continue;
        }
        s += '<text class="svg-lbl dim" x="' + (b.r + 14) + '" y="' + (pp.y + 4) + '">' + esc(lab) + '</text>';
      }
    });

    /* ---- splices ---- */
    DATA.splices.forEach(function (sp) {
      var pos = g.splices[sp.id]; if (!pos) return;
      s += '<rect x="' + (pos.x - 24) + '" y="' + (pos.y - 11) + '" width="48" height="22" rx="10" ' +
        'fill="var(--panel)" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 2.5"/>';
      s += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="5" fill="' + hex(sp.color) + '" stroke="var(--wire-edge)" stroke-width="1.4"/>';
      s += '<rect class="cavhit" data-splice="' + esc(sp.id) + '" data-busy="1" x="' + (pos.x - 24) + '" y="' + (pos.y - 11) +
        '" width="48" height="22" rx="10" fill="transparent"/>';
      s += '<text class="svg-lbl" x="' + pos.x + '" y="' + (pos.y - 17) + '" text-anchor="middle">' + esc(sp.ref) + '</text>';
    });

    s += '<g id="draglayer"></g></svg>';
    return '<div class="draw-panel">' + s + '</div>';
  }

  /* ---------------- cut list ---------------- */

  var KINDS = ['wire', 'jumper', 'nc', 'stub'];

  var BOM_COLS = [['qty','Qty','num'],['meas','Meas','mono'],['item','Item','mono'],['desig','Designators','mono'],['desc','Description','desc']];
  function autoBom() {
    var rows = [], seen = {};
    DATA.nodes.forEach(function (n) {
      rows.push({ qty: '1', meas: 'EACH', item: n.pn || 'TBD', desig: n.ref, desc: n.name + (n.type ? ' — ' + n.type : '') });
    });
    DATA.nodes.forEach(function (n) {
      var cnt = 0;
      DATA.links.forEach(function (l) {
        [l.from, l.to].forEach(function (e) { if (e && e.n === n.id) cnt++; });
      });
      if (!cnt) return;
      if (/solder/i.test(n.termination || '')) {
        rows.push({ qty: String(cnt), meas: 'EACH', item: '—', desig: n.ref, desc: 'SOLDER JOINT — ' + n.name + ' (no contacts)' });
        return;
      }
      rows.push({ qty: String(cnt), meas: 'EACH', item: n.contactPn || 'TBD', desig: n.ref, desc: 'CONTACT, CRIMP — ' + n.name });
    });
    DATA.links.forEach(function (l) {
      if (!l.gauge && !l.color) return;
      var k = l.gauge + '|' + l.color + '|' + l.length;
      if (seen[k]) { seen[k].refs.push(l.ref); seen[k].n++; return; }
      seen[k] = { refs: [l.ref], n: 1, l: l };
    });
    Object.keys(seen).forEach(function (k) {
      var g = seen[k], mm = parseFloat(g.l.length) || 0;
      rows.push({ qty: mm ? String(mm * g.n) : '—', meas: mm ? 'mm' : '', item: g.l.note && /^V\d/.test(g.l.note) ? g.l.note : 'TBD',
        desig: g.refs.length > 2 ? g.refs[0] + '-' + g.refs[g.refs.length - 1] : g.refs.join(', '),
        desc: 'WIRE STRANDED ' + (g.l.gauge || '').replace(' ', '') + ' ' + (ab(g.l.color) || g.l.color) +
              (g.n > 1 ? ' (' + g.n + ' × ' + g.l.length + ')' : '') });
    });
    return rows;
  }

  /* ---------------- dragging: wire ends between pins, and wire routing ---------------- */
  var dragState = null, dragInstalled = false, rafPending = false, lastTap = null;

  function epKey(e) { if (!e) return ''; return e.s != null ? 's:' + e.s : (e.n != null ? 'n:' + e.n + ':' + e.p : ''); }
  function hitKey(el) {
    if (!el) return '';

    if (el.dataset.node) return 'n:' + el.dataset.node + ':' + el.dataset.pin;

  }
  function findEnd(key) {
    for (var i = 0; i < DATA.links.length; i++) {
      if (epKey(DATA.links[i].from) === key) return { i: i, w: 'from' };
      if (epKey(DATA.links[i].to) === key) return { i: i, w: 'to' };
    }
    return null;
  }
  function theSvg() { return app.querySelector('.draw-panel svg'); }
  function svgPt(ev) {
    var svg = theSvg(); if (!svg) return { x: 0, y: 0 };
    var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    return { x: (ev.clientX - r.left) / r.width * vb.width, y: (ev.clientY - r.top) / r.height * vb.height };
  }
  function targetUnder(ev) {
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.classList && el.classList.contains('cavhit') ? el : null;
  }
  function clearHot() {
    var svg = theSvg(); if (!svg) return;
    Array.prototype.forEach.call(svg.querySelectorAll('.drop-hot'), function (e) { e.classList.remove('drop-hot'); });
  }

  function wireDrag() {
    if (view !== 'edit' || !editing) return;
    var svg = theSvg(); if (!svg) return;

    Array.prototype.forEach.call(svg.querySelectorAll('.cavhit'), function (el) {
      el.addEventListener('pointerdown', function (ev) {
        var key = hitKey(el); if (!key) return;
        var end = findEnd(key); if (!end) return;       /* only an occupied end can be moved */
        ev.preventDefault();
        var o = svgPt(ev);
        dragState = { kind: 'end', end: end, from: key };
        svg.classList.add('dragging');
        var layer = svg.querySelector('#draglayer');
        if (layer) layer.innerHTML = '<line id="dragline" x1="' + o.x + '" y1="' + o.y + '" x2="' + o.x +
          '" y2="' + o.y + '" stroke="var(--edit)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>';
      });
    });

    Array.prototype.forEach.call(svg.querySelectorAll('.routehit'), function (el) {
      el.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        var i = parseInt(el.dataset.link, 10), now = Date.now();
        /* pointerdown suppresses the native dblclick, so detect the second tap here */
        if (lastTap && lastTap.i === i && now - lastTap.t < 400) {
          lastTap = null;
          if (DATA.links[i]) delete DATA.links[i].route;
          redraw(); markDirty(); setStatus('Routing cleared for that wire');
          return;
        }
        lastTap = { i: i, t: now };
        dragState = { kind: 'route', i: i };
        svg.classList.add('dragging');
      });
    });

    if (dragInstalled) return;
    dragInstalled = true;

    document.addEventListener('pointermove', function (ev) {
      if (!dragState) return;
      if (dragState.kind === 'end') {
        var svg2 = theSvg(); if (!svg2) return;
        var q = svgPt(ev), ln = svg2.querySelector('#dragline');
        if (ln) { ln.setAttribute('x2', q.x); ln.setAttribute('y2', q.y); }
        clearHot();
        var t = targetUnder(ev); if (t) t.classList.add('drop-hot');
        return;
      }
      /* routing: move the waypoint and redraw on the next frame */
      var pt = svgPt(ev);
      var l = DATA.links[dragState.i]; if (!l) return;
      l.route = { x: Math.round(pt.x), y: Math.round(pt.y) };
      if (rafPending) return;
      rafPending = true;
      window.requestAnimationFrame(function () {
        rafPending = false;
        if (!dragState) return;
        redraw();
        var svg3 = theSvg(); if (svg3) svg3.classList.add('dragging');
      });
    });

    function finish(ev) {
      if (!dragState) return;
      var d = dragState; dragState = null;
      var svg4 = theSvg();
      if (svg4) {
        svg4.classList.remove('dragging');
        var layer2 = svg4.querySelector('#draglayer'); if (layer2) layer2.innerHTML = '';
      }
      clearHot();
      if (d.kind === 'route') { markDirty(); setStatus('Wire routed — double-click the handle to undo it'); return; }
      var t = targetUnder(ev); if (!t) return;
      var tk = hitKey(t); if (!tk || tk === d.from) return;
      var occupant = findEnd(tk);
      DATA.links[d.end.i][d.end.w] = epParse(tk);
      if (occupant) DATA.links[occupant.i][occupant.w] = epParse(d.from);   /* swap rather than double up */
      rerenderAll(); markDirty();
      setStatus(occupant ? 'Swapped' : 'Moved');
    }
    document.addEventListener('pointerup', finish);
    document.addEventListener('pointercancel', function () {
      dragState = null; clearHot();
      var svg5 = theSvg(); if (svg5) { svg5.classList.remove('dragging');
        var l5 = svg5.querySelector('#draglayer'); if (l5) l5.innerHTML = ''; }
    });
  }

  function setStatus(msg, d2) {

    if (dirty) { el.textContent = '⚠ Not saved — storage full. Use Export JSON or Download backup'; el.className = 'status dirty'; return; }

  function bindEditable(el) {
    el.addEventListener('input', function () {
      var txt = el.textContent.replace(/\s+/g, ' ').trim();
      var sc = el.dataset.scope, k = el.dataset.k, meta = el.dataset.meta, i = parseInt(el.dataset.i, 10);
      if (sc === 'connectors') { STORE.connectors[i][k] = (k === 'pins') ? (parseInt(txt, 10) || 1) : txt; }
      else if (sc === 'connnode') {
        var cdef = connById(DATA.nodes[i].conn);
        if (cdef) { cdef[k] = txt; DATA.nodes[i][k] = txt; redraw(); }
      }
      else if (sc === 'links') { DATA.links[i][k] = txt; redraw(); }
      else if (sc === 'nodes') { DATA.nodes[i][k] = txt; redraw(); }
      else if (sc === 'splices') { DATA.splices[i][k] = txt; redraw(); }
      else if (sc === 'bom') { DATA.bom[i][k] = txt; }
      else if (sc === 'titleBlock') { DATA.titleBlock[k] = txt; }
      else if (meta) { DATA[meta] = txt; }
      markDirty();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && el.dataset.k !== 'notes') { e.preventDefault(); el.blur(); }
    });
    el.addEventListener('paste', function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, t.replace(/\s+/g, ' '));
    });
  }

  function applyEditState() {

  function attachPhoto() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var img = new Image();
        img.onload = function () {
          var mx = 1500, sc = Math.min(1, mx / img.width);
          var cv = document.createElement('canvas');
          cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          DATA.photo = cv.toDataURL('image/jpeg', 0.72);
          rerenderAll(); markDirty();
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(f);
    });
    inp.click();
  }

  function download(fn, text, mime) {
    var blob = new Blob([text], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = fn;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  }
  function exportJson() { download('va-harness-data.json', JSON.stringify(serialize(), null, 1), 'application/json'); setStatus('Data exported'); }
  function importJson() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          if (!d || !d.harnesses) throw 0;
          if (!window.confirm('Replace the current library with ' + d.harnesses.length + ' harnesses from this file?')) return;
          STORE = d; STORE.colors = STORE.colors || SEED.colors; STORE.abbr = STORE.abbr || SEED.abbr;
          view = 'list'; DATA = null; rerenderAll(); markDirty(); setStatus('Imported');
        } catch (e) { window.alert('That file is not a harness library export.'); }
      };
      rd.readAsText(f);
    });
    inp.click();
  }
  function csvCell(s2) { s2 = String(s2 == null ? '' : s2); return /[",\n]/.test(s2) ? '"' + s2.replace(/"/g, '""') + '"' : s2; }
  function exportCsv() {
    var rows = [['CUT LIST — ' + DATA.title], ['Wire', 'Type', 'From', 'Color', 'Abbr', 'To', 'AWG', 'Length', 'Signal']];
    DATA.links.forEach(function (l) {
      rows.push([l.ref, l.kind, endLabel(l.from), l.color, ab(l.color), endLabel(l.to), l.gauge, l.length, l.signal]);
    });
    rows.push([]); rows.push(['BILL OF MATERIALS']);
    rows.push(['Id'].concat(BOM_COLS.map(function (c) { return c[1]; })));
    (DATA.bom && DATA.bom.length ? DATA.bom : autoBom()).forEach(function (r, i) {
      rows.push([i + 1].concat(BOM_COLS.map(function (c) { return r[c[0]]; })));
    });
    download((DATA.assemblyPn || 'harness') + '-cutlist-bom.csv', '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'), 'text/csv');
    setStatus('CSV exported');
  }
  window.addEventListener('beforeunload', function (e) { if (!dirty) return; e.preventDefault(); e.returnValue = ''; });

  render();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
